name: Release agentwiki-launcher (Go)

# Builds the AgentWikiLauncher for macOS (signed + notarized + stapled
# .app), Linux (amd64 + arm64 tarballs), and Windows (amd64 zip).
#
# macOS-only steps pull Apple signing secrets from AWS Secrets Manager
# via OIDC; Linux + Windows builds need no secrets and run on
# ubuntu-latest using Go's cross-compiler. The macOS job is cached on
# inputs so doc-only or unrelated changes don't pay the notarization
# cost; Linux + Windows are fast enough that caching isn't worth the
# complexity yet.
#
# Triggers:
#   - workflow_dispatch: manual run from the Actions tab
#   - workflow_call:     invoked by docker-build-push.yml + nightly-build.yml
#                        so the launcher artifacts land in the backend
#                        image at `backend/static/installers/`.
#
# Outputs:
#   darwin-artifact-name, linux-artifact-name, windows-artifact-name —
#   upload-artifact names for callers to download with download-artifact.

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      darwin-artifact-name:
        description: "Artifact name containing AgentWikiLauncher.zip + darwin binaries"
        value: ${{ jobs.darwin.outputs.artifact-name }}
      linux-artifact-name:
        description: "Artifact name containing linux-amd64 + linux-arm64 tarballs"
        value: ${{ jobs.linux.outputs.artifact-name }}
      windows-artifact-name:
        description: "Artifact name containing windows-amd64 zip"
        value: ${{ jobs.windows.outputs.artifact-name }}

permissions:
  id-token: write
  contents: read

jobs:
  darwin:
    name: macOS — sign, notarize, staple
    runs-on: macos-14
    timeout-minutes: 60
    outputs:
      artifact-name: ${{ steps.set-artifact.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      # Content-addressable cache: keyed on inputs that actually affect
      # the built+signed bundle (Go source, build config, signing
      # scripts, AppleScript stub). README and other non-build assets
      # are intentionally excluded so doc changes don't bust the cache.
      # Test files (*_test.go) are still hashed under the .go glob
      # because hashFiles can't negate; small price for the simpler
      # glob, and test changes are rare.
      - name: Restore launcher cache
        id: cache
        uses: actions/cache@v4
        with:
          path: packages/agentwiki-launcher-go/dist/
          key: |
            agentwiki-launcher-darwin-${{ hashFiles(
              'packages/agentwiki-launcher-go/cmd/**/*.go',
              'packages/agentwiki-launcher-go/internal/**/*.go',
              'packages/agentwiki-launcher-go/go.mod',
              'packages/agentwiki-launcher-go/go.sum',
              'packages/agentwiki-launcher-go/Makefile',
              'packages/agentwiki-launcher-go/scripts/build-app.sh',
              'packages/agentwiki-launcher-go/scripts/stub.applescript'
            ) }}

      - name: Setup Go
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/agentwiki-launcher-go/go.mod
          cache: false

      - name: Configure AWS credentials (OIDC)
        if: steps.cache.outputs.cache-hit != 'true'
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-2

      - name: Pull Apple secrets
        if: steps.cache.outputs.cache-hit != 'true'
        uses: aws-actions/aws-secretsmanager-get-secrets@a9a7eb4e2f2871d30dc5b892576fde60a2ecc802
        with:
          # left = env var name (matches scripts/build-app.sh expectations)
          # right = AWS Secrets Manager secret id
          secret-ids: |
            APPLE_ID, deploy/apple-id
            APPLE_TEAM_ID, deploy/apple-team-id
            APPLE_APP_PASSWORD, deploy/apple-password
            APPLE_CERT_BASE64, deploy/apple-certificate
            APPLE_CERT_PASSWORD, deploy/apple-certificate-password

      - name: Build, sign, notarize, staple AgentWikiLauncher.app
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: packages/agentwiki-launcher-go
        run: ./scripts/build-app.sh

      - name: Set artifact name
        id: set-artifact
        run: echo "name=agentwiki-launcher-darwin-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set-artifact.outputs.name }}
          path: |
            packages/agentwiki-launcher-go/dist/AgentWikiLauncher.zip
            packages/agentwiki-launcher-go/dist/agentwiki-launcher-darwin-*
          if-no-files-found: error
          retention-days: 7

  linux:
    name: Linux — AppImage + tarballs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-name: ${{ steps.set-artifact.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/agentwiki-launcher-go/go.mod
          cache: false

      - name: Install appimagetool + rpm
        run: |
          set -euo pipefail
          # AppImage upstream release. Pin to a known-good continuous build.
          curl --fail --location --silent --show-error \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            -o /usr/local/bin/appimagetool
          chmod +x /usr/local/bin/appimagetool
          # GitHub runners don't have FUSE; extract + use the embedded
          # appimagetool binary instead of running the AppImage directly.
          /usr/local/bin/appimagetool --appimage-extract >/dev/null
          sudo mv squashfs-root /opt/appimagetool
          sudo ln -sf /opt/appimagetool/AppRun /usr/local/bin/appimagetool
          # rpm-build for build-rpm.sh
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends rpm

      - name: Build Linux tarballs
        working-directory: packages/agentwiki-launcher-go
        run: ./scripts/build-linux.sh

      - name: Build Linux AppImage
        working-directory: packages/agentwiki-launcher-go
        # appimagetool inside the runner can't use FUSE; pass
        # APPIMAGE_EXTRACT_AND_RUN=1 to fall back to extract+run.
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: ./scripts/build-appimage.sh

      - name: Build Linux .deb
        working-directory: packages/agentwiki-launcher-go
        run: ./scripts/build-deb.sh

      - name: Build Linux .rpm
        working-directory: packages/agentwiki-launcher-go
        run: ./scripts/build-rpm.sh

      - name: Set artifact name
        id: set-artifact
        run: echo "name=agentwiki-launcher-linux-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set-artifact.outputs.name }}
          path: |
            packages/agentwiki-launcher-go/dist/agentwiki-launcher-linux-*.tar.gz
            packages/agentwiki-launcher-go/dist/AgentWikiLauncher-x86_64.AppImage
            packages/agentwiki-launcher-go/dist/agentwiki-launcher_*_amd64.deb
            packages/agentwiki-launcher-go/dist/agentwiki-launcher-*-1*.x86_64.rpm
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows — amd64 .exe (windowsgui)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact-name: ${{ steps.set-artifact.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: packages/agentwiki-launcher-go/go.mod
          cache: false

      - name: Build Windows .exe
        working-directory: packages/agentwiki-launcher-go
        run: ./scripts/build-windows.sh

      - name: Set artifact name
        id: set-artifact
        run: echo "name=agentwiki-launcher-windows-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set-artifact.outputs.name }}
          path: packages/agentwiki-launcher-go/dist/agentwiki-launcher-windows-*.exe
          if-no-files-found: error
          retention-days: 7
