name: Release agentwiki-launcher (Go)

# Builds, signs (Developer ID Application), notarizes, and staples
# AgentWikiLauncher.app. Secrets live in AWS Secrets Manager
# (`deploy/apple-*`); the workflow assumes an OIDC role and pulls them at
# build time — same pattern as onyx-dot-app/onyx desktop deployment.
#
# Triggers:
#   - workflow_dispatch: manual run from the Actions tab
#   - workflow_call:     invoked by docker-build-push.yml + nightly-build.yml
#                        so the freshly notarized .zip lands in the backend
#                        image at `backend/static/installers/`.
#
# Outputs:
#   artifact-name: the upload-artifact name for callers to download.

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      artifact-name:
        description: "Artifact name containing AgentWikiLauncher.zip + darwin binaries"
        value: ${{ jobs.release.outputs.artifact-name }}

permissions:
  id-token: write
  contents: read

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 60
    outputs:
      artifact-name: ${{ steps.set-artifact.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      # Content-addressable cache: keyed on the launcher source tree. When
      # backend-only PRs reuse the same launcher source, the build, sign,
      # notarize, and staple steps are skipped — only the artifact upload
      # runs (~30s vs ~5min cold). Stapled .app tickets don't expire, so
      # cached zips are valid until source changes evict them.
      - name: Restore launcher cache
        id: cache
        uses: actions/cache@v4
        with:
          path: packages/agentwiki-launcher-go/dist/
          key: agentwiki-launcher-${{ hashFiles('packages/agentwiki-launcher-go/**') }}

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: packages/agentwiki-launcher-go/go.mod
          cache: false

      - name: Configure AWS credentials (OIDC)
        if: steps.cache.outputs.cache-hit != 'true'
        uses: aws-actions/configure-aws-credentials@ec61189d14ec14c8efccab744f656cffd0e33f37
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: us-east-2

      - name: Pull Apple secrets
        if: steps.cache.outputs.cache-hit != 'true'
        uses: aws-actions/aws-secretsmanager-get-secrets@a9a7eb4e2f2871d30dc5b892576fde60a2ecc802
        with:
          # left = env var name (matches scripts/build-app.sh expectations)
          # right = AWS Secrets Manager secret id
          secret-ids: |
            APPLE_ID, deploy/apple-id
            APPLE_TEAM_ID, deploy/apple-team-id
            APPLE_APP_PASSWORD, deploy/apple-password
            APPLE_CERT_BASE64, deploy/apple-certificate
            APPLE_CERT_PASSWORD, deploy/apple-certificate-password

      - name: Build, sign, notarize, staple AgentWikiLauncher.app
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: packages/agentwiki-launcher-go
        run: ./scripts/build-app.sh

      - name: Set artifact name
        id: set-artifact
        run: echo "name=agentwiki-launcher-darwin-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set-artifact.outputs.name }}
          path: |
            packages/agentwiki-launcher-go/dist/AgentWikiLauncher.zip
            packages/agentwiki-launcher-go/dist/agentwiki-launcher-darwin-*
          if-no-files-found: error
          retention-days: 7
