name: Evals nightly

# Live eval matrix against real LLM providers. Runs on a schedule + on
# demand. Results push to Braintrust so the model matrix is visible over
# time. Provider keys come from repo secrets.
#
# Cheap smoke checks (no API keys) run on every PR in evals-smoke.yml.

concurrency:
  group: evals-nightly
  cancel-in-progress: false

on:
  schedule:
    # 04:00 UTC daily — outside US/EU work hours
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      models:
        description: "Comma-separated model ids (wiki_updater + external_agent surfaces)"
        required: false
        default: "claude-sonnet-4-6,gpt-5"
      selector_models:
        description: "Comma-separated model ids (cheap pre-filter surface)"
        required: false
        default: "claude-haiku-4-5,gpt-5-mini"

jobs:
  live:
    runs-on: ubuntu-latest
    # Bumped 45 → 120. wiki_updater alone now runs ~268 cases × 2 models
    # × 3 runs + judge panel and burned ~24 min on 2026-05-27, which
    # cancelled external_agent mid-step at the prior 45m cap. Triggers
    # eval adds a fourth step; 120 leaves headroom for dataset growth.
    timeout-minutes: 120
    defaults:
      run:
        working-directory: backend
    env:
      EVAL_ANTHROPIC_API_KEY: ${{ secrets.EVAL_ANTHROPIC_API_KEY }}
      EVAL_OPENAI_API_KEY: ${{ secrets.EVAL_OPENAI_API_KEY }}
      BRAINTRUST_API_KEY: ${{ secrets.BRAINTRUST_API_KEY }}
      BRAINTRUST_PROJECT: ${{ vars.BRAINTRUST_PROJECT || 'agent-wiki' }}
      BRAINTRUST_ORG: ${{ vars.BRAINTRUST_ORG || 'Onyx 2' }}
      EVAL_MODELS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.models || 'claude-sonnet-4-6,gpt-5' }}
      SELECTOR_MODELS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.selector_models || 'claude-haiku-4-5,gpt-5-mini' }}
      OPENSEARCH_URL: ""
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Install backend deps
        run: uv sync --extra dev

      - name: wiki_updater live run
        run: |
          uv run python -m evals.wiki_updater.run \
            --cases evals/datasets/wiki_updater/cases \
            --models "$EVAL_MODELS" \
            --concurrency 16 \
            --braintrust "nightly-wiki-updater-$(date -u +%Y%m%d)" \
            --dataset "wiki-updater" \
            --out runs/nightly_wiki_updater.jsonl

      - name: ingest_selector live run
        run: |
          uv run python -m evals.ingest_selector.run \
            --cases evals/datasets/ingest_selector/cases.jsonl \
            --models "$SELECTOR_MODELS" \
            --concurrency 16 \
            --braintrust "nightly-ingest-selector-$(date -u +%Y%m%d)" \
            --dataset "ingest-selector" \
            --out runs/nightly_ingest_selector.jsonl

      - name: external_agent live run
        run: |
          uv run python -m evals.external_agent.run \
            --scenarios evals/datasets/external_agent/scenarios \
            --models "$EVAL_MODELS" \
            --concurrency 16 \
            --braintrust "nightly-external-agent-$(date -u +%Y%m%d)" \
            --out runs/nightly_external_agent.jsonl

      - name: triggers live run
        run: |
          uv run python -m evals.triggers.run \
            --cases evals/datasets/triggers/cases \
            --models "$EVAL_MODELS" \
            --concurrency 16 \
            --braintrust "nightly-triggers-$(date -u +%Y%m%d)" \
            --dataset "triggers" \
            --out runs/nightly_triggers.jsonl

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-nightly-runs
          path: backend/runs/
          if-no-files-found: ignore
