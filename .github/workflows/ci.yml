name: Quality Checks PR

concurrency:
  group: Quality-Checks-PR-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
  workflow_dispatch:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.13.3

      # The ruff and basedpyright hooks are language: system and shell out to
      # `uv run --project backend --extra dev …`, so uv must be on PATH.
      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      - name: Run pre-commit
        uses: j178/prek-action@v2.0.2
        with:
          extra_args: ${{ github.event_name == 'pull_request' && format('--from-ref {0} --to-ref {1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '' }}
