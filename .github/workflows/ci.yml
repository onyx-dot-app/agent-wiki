name: Quality Checks PR

concurrency:
  group: Quality-Checks-PR-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
  workflow_dispatch:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.13.3

      # The ruff and basedpyright hooks are language: system and shell out to
      # `uv run --project backend --extra dev …`, so uv must be on PATH.
      - name: Setup uv
        uses: astral-sh/setup-uv@v3

      # The prettier and tsc hooks are language: system and shell out to
      # `bun run …` inside frontend/, so bun and node_modules must exist.
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install frontend deps
        run: bun install --frozen-lockfile
        working-directory: frontend

      - name: Run pre-commit
        uses: j178/prek-action@v2.0.2
        with:
          extra_args: ${{ github.event_name == 'pull_request' && format('--from-ref {0} --to-ref {1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || '' }}
