name: Nightly Image Build

# Builds + pushes `onyxdotapp/agent-wiki-{backend,frontend}:nightly-latest-YYYYMMDD`
# to Docker Hub on a daily cron. The downstream deploy job in onyx-infra picks
# up the tag an hour later. Postgres and nginx run stock upstream images
# (`postgres:17`, `nginx:1.27-alpine`) — nothing custom to build for those.
#
# Stable `v*` releases continue to go through `docker-build-push.yml`; this
# workflow is just the nightly cadence.

on:
  schedule:
    - cron: "0 10 * * *" # 2 AM PST / 3 AM PDT — deploy job runs an hour later
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: onyxdotapp

permissions:
  id-token: write
  contents: read

jobs:
  build-launcher:
    name: Build, sign, notarize AgentWikiLauncher.app
    uses: ./.github/workflows/release-agentwiki-launcher-go.yml
    secrets: inherit

  build:
    runs-on: ubuntu-latest
    needs: build-launcher
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: ./backend
          - component: frontend
            context: ./frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute nightly tag
        id: tag
        run: echo "tag=nightly-latest-$(date -u +'%Y%m%d')" >> "$GITHUB_OUTPUT"

      - name: Download notarized launcher artifact
        if: matrix.component == 'backend'
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-launcher.outputs.artifact-name }}
          path: backend/static/installers/

      - name: Verify launcher artifact present
        if: matrix.component == 'backend'
        run: |
          set -euo pipefail
          test -s backend/static/installers/AgentWikiLauncher.zip
          ls -lh backend/static/installers/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ env.DOCKERHUB_USERNAME }}/agent-wiki-${{ matrix.component }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify Slack on failure
        if: failure()
        uses: onyx-dot-app/onyx/.github/actions/slack-notify@main
        with:
          webhook-url: ${{ secrets.MONITOR_DEPLOYMENTS_WEBHOOK }}
          title: "🚨 Nightly Image Build Failed (agent-wiki)"
          ref-name: ${{ github.ref_name }}
          failed-jobs: "build (${{ matrix.component }})"
