name: Build and Push Docker Images

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: onyxdotapp

permissions:
  id-token: write
  contents: read

jobs:
  build-launchers:
    name: Build launchers (mac + linux + windows)
    uses: ./.github/workflows/release-agentwiki-launcher-go.yml
    secrets: inherit

  build-backend:
    name: Build and Push Backend Image
    needs: build-launchers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download macOS launcher
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-launchers.outputs.darwin-artifact-name }}
          path: backend/static/installers/

      - name: Download Linux launcher
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-launchers.outputs.linux-artifact-name }}
          path: backend/static/installers/

      - name: Download Windows launcher
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-launchers.outputs.windows-artifact-name }}
          path: backend/static/installers/

      - name: Verify launcher artifacts present
        run: |
          set -euo pipefail
          test -s backend/static/installers/AgentWikiLauncher.zip
          test -s backend/static/installers/agentwiki-launcher-linux-amd64.tar.gz
          test -s backend/static/installers/agentwiki-launcher-linux-arm64.tar.gz
          test -s backend/static/installers/AgentWikiLauncher-x86_64.AppImage
          test -s backend/static/installers/agentwiki-launcher-windows-amd64.exe
          ls -lh backend/static/installers/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/agent-wiki-backend
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-frontend:
    name: Build and Push Frontend Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/agent-wiki-frontend
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
