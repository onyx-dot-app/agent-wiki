name: Backend tests

# Non-blocking on PRs: this workflow reports real pass/fail, but the
# check is intentionally NOT in branch-protection's required list. Read
# the run logs to see results; do not gate merges on this job.

concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  pull_request:
    # Only run when backend code changes — there's nothing here for a
    # frontend-only or workflow-only PR to exercise. Mirrors frontend.yml's
    # `paths` guard. (backend/** covers deps too: pyproject.toml + uv.lock.)
    paths:
      - "backend/**"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/agent_wiki_test
      TEST_REDIS_URL: redis://localhost:6379/1
      SECRET_KEY: ci-test-secret

    steps:
      - uses: actions/checkout@v4

      - name: Start Postgres
        # Durability off: this database is thrown away with the runner, and
        # the suite creates/drops a database per test — fsync latency on a
        # shared runner disk otherwise dominates wall time and varies run
        # to run.
        run: |
          docker run -d --name agent-wiki-pg \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=agent_wiki \
            -p 127.0.0.1:5432:5432 \
            --shm-size=256mb \
            postgres:17 \
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off

      - name: Start Redis
        run: |
          docker run -d --name agent-wiki-redis \
            -p 127.0.0.1:6379:6379 \
            redis:7-alpine

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 60); do
            if docker exec agent-wiki-pg pg_isready -U postgres -d agent_wiki >/dev/null 2>&1; then
              echo "Postgres ready"; exit 0
            fi
            sleep 1
          done
          echo "Postgres did not become ready"; docker logs agent-wiki-pg; exit 1

      - name: Wait for Redis
        run: |
          for i in $(seq 1 30); do
            if docker exec agent-wiki-redis redis-cli ping | grep -q PONG; then
              echo "Redis ready"; exit 0
            fi
            sleep 1
          done
          echo "Redis did not become ready"; docker logs agent-wiki-redis; exit 1

      - name: Create test database
        run: docker exec agent-wiki-pg createdb -U postgres agent_wiki_test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install backend deps
        working-directory: backend
        run: uv sync --extra dev

      - name: Unit tests
        working-directory: backend
        run: uv run pytest tests --ignore=tests/integration -v

      - name: Integration tests
        working-directory: backend
        run: uv run pytest tests/integration -v

      - name: Postgres logs on failure
        if: failure()
        run: docker logs agent-wiki-pg

      - name: Redis logs on failure
        if: failure()
        run: docker logs agent-wiki-redis
