worker_processes auto;
events { worker_connections 1024; }

http {
    sendfile on;
    keepalive_timeout 65;

    # Use Docker's internal DNS so upstream hostnames resolve at request time,
    # not at startup — prevents nginx from crashing when containers start in
    # parallel.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_name _;

        client_max_body_size 25m;

        # The onyx-editor live-doc WebSocket (plans/onyx-editor.md, Phase 1/2)
        # needs the Upgrade/Connection handshake forwarded, unlike the rest of
        # /api/ (plain HTTP + SSE so far — proxy_buffering off is enough for
        # those, no upgrade needed). A more specific prefix than /api/ below,
        # so nginx's longest-match-wins picks this block for it.
        location /api/coedit/ws/ {
            set $backend http://backend:8080;
            proxy_pass         $backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /api/ {
            set $backend http://backend:8080;
            proxy_pass         $backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # /api/chat and /api/mcp serve text/event-stream. With buffering
            # on, nginx holds events until the response completes — chat
            # streaming and the MCP long-poll both break. Mirrors the
            # Helm ingress annotations in deploy/helm/.../values.yaml.
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location / {
            set $frontend http://frontend:3000;
            proxy_pass         $frontend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
