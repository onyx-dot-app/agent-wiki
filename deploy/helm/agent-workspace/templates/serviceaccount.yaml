{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agent-workspace.serviceAccountName" . }}
  labels:
    {{- include "agent-workspace.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.backup.enabled }}
---
# Dedicated identity for the backup CronJob so bucket credentials granted
# via IRSA/annotations don't extend to the app pods.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agent-workspace.fullname" . }}-backup
  labels:
    {{- include "agent-workspace.labels" . | nindent 4 }}
    app.kubernetes.io/component: backup
  {{- with .Values.backup.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
