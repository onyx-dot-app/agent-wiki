{{- if .Values.monitoring.serviceMonitor.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agent-workspace.fullname" . }}-grafana-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    grafana_dashboard: "1"
    {{- include "agent-workspace.labels" . | nindent 4 }}
data:
  agent-wiki-ingestion.json: |-
{{ .Files.Get "files/agent-wiki-dashboard.json" | indent 4 }}
  agent-wiki-http.json: |-
{{ .Files.Get "files/agent-wiki-http-dashboard.json" | indent 4 }}
{{- end }}
