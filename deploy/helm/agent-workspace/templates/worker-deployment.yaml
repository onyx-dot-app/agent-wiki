{{- /*
One Deployment per worker group. The backend's `app.tasks.run_worker` takes one
or more queue names and runs each as its own consumer (thread pool) in a single
process — queues stay isolated (separate Redis streams) while a group shares one
process's memory floor. Groups are defined in `.Values.worker.groups`; queue
names must exist in `backend/app/tasks/queues.py:QUEUES`, and `metricsPort` must
equal the lowest run_worker `_METRICS_PORT` among the group's queues (run_worker
binds that port).
*/ -}}
{{- range $group := .Values.worker.groups }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-workspace.fullname" $ }}-worker-{{ $group.name | replace "_" "-" }}
  labels:
    {{- include "agent-workspace.labels" $ | nindent 4 }}
    app.kubernetes.io/component: worker
    agent-workspace.onyx.app/worker-group: {{ $group.name }}
spec:
  replicas: {{ $.Values.worker.replicaCount }}
  # The worker mounts the same RWO wiki-data PVC as the backend; Recreate
  # avoids two pods holding the wiki working tree at once during rollouts.
  # It also keeps the in-process periodic scheduler single-replica.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "agent-workspace.name" $ }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: worker
      agent-workspace.onyx.app/worker-group: {{ $group.name }}
  template:
    metadata:
      labels:
        {{- include "agent-workspace.labels" $ | nindent 8 }}
        app.kubernetes.io/component: worker
        agent-workspace.onyx.app/worker-group: {{ $group.name }}
    spec:
      serviceAccountName: {{ include "agent-workspace.serviceAccountName" $ }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* The relevance filter runs only where the documents queue lives;   */ -}}
      {{- /* fetch the warm model only there, and only when one is configured.  */ -}}
      {{- $relevanceModel := and (has "documents" $group.queues) (not (empty $.Values.ingestRelevance.twoTower.s3Uri)) }}
      {{- $modelPath := printf "%s/model.onnx" $.Values.ingestRelevance.twoTower.mountPath }}
      {{- if $relevanceModel }}
      initContainers:
        - name: fetch-relevance-model
          image: "{{ $.Values.image.backend.repository }}:{{ $.Values.image.backend.tag }}"
          imagePullPolicy: {{ $.Values.image.backend.pullPolicy }}
          command: ["python", "-m", "app.scripts.download_relevance_model"]
          {{- with $.Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: INGEST_RELEVANCE_TWO_TOWER_MODEL_PATH
              value: {{ $modelPath | quote }}
            - name: INGEST_RELEVANCE_TWO_TOWER_S3_URI
              value: {{ $.Values.ingestRelevance.twoTower.s3Uri | quote }}
            - name: INGEST_RELEVANCE_TWO_TOWER_S3_ENDPOINT
              value: {{ $.Values.ingestRelevance.twoTower.endpoint | quote }}
            - name: INGEST_RELEVANCE_TWO_TOWER_S3_REGION
              value: {{ $.Values.ingestRelevance.twoTower.region | quote }}
          volumeMounts:
            - name: relevance-model
              mountPath: {{ $.Values.ingestRelevance.twoTower.mountPath | quote }}
      {{- end }}
      containers:
        - name: worker
          image: "{{ $.Values.image.backend.repository }}:{{ $.Values.image.backend.tag }}"
          imagePullPolicy: {{ $.Values.image.backend.pullPolicy }}
          command:
            - python
            - -m
            - app.tasks.run_worker
            {{- range $q := $group.queues }}
            - {{ $q | quote }}
            {{- end }}
          ports:
            - name: metrics
              containerPort: {{ $group.metricsPort }}
              protocol: TCP
          {{- with $.Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- include "agent-workspace.backendEnv" $ | nindent 12 }}
            {{- if $relevanceModel }}
            - name: INGEST_RELEVANCE_TWO_TOWER_MODEL_PATH
              value: {{ $modelPath | quote }}
            {{- end }}
          volumeMounts:
            {{- include "agent-workspace.backendVolumeMounts" $ | nindent 12 }}
            {{- if $relevanceModel }}
            - name: relevance-model
              mountPath: {{ $.Values.ingestRelevance.twoTower.mountPath | quote }}
            {{- end }}
          resources:
            {{- toYaml $.Values.worker.resources | nindent 12 }}
      volumes:
        {{- include "agent-workspace.backendVolumes" $ | nindent 8 }}
        {{- if $relevanceModel }}
        - name: relevance-model
          emptyDir: {}
        {{- end }}
      # Co-schedule with the backend so the RWO PVCs land on the same node.
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - {{ include "agent-workspace.name" $ }}
                  - key: app.kubernetes.io/component
                    operator: In
                    values:
                      - backend
              topologyKey: kubernetes.io/hostname
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
