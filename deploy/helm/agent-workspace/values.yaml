# Defaults for agent-workspace.
#
# Backend + worker share one RWO PVC (wiki-data) and run as a single
# replica each — the wiki git working tree has no concurrent-write story,
# and the per-queue periodic-task scheduler runs in-process (multiple
# replicas would double-fire crons). App state + task queues live in
# Postgres, reached via DATABASE_URL. See CLAUDE.md / background-tasks doc.
# The frontend is stateless and can scale.

nameOverride: ""
fullnameOverride: ""

image:
  # Published by .github/workflows/docker-build-push.yml on `v*` tags.
  # Override `tag` per-deploy to pin a specific release.
  backend:
    repository: onyxdotapp/agent-wiki-backend
    tag: latest
    pullPolicy: IfNotPresent
  frontend:
    repository: onyxdotapp/agent-wiki-frontend
    tag: latest
    pullPolicy: IfNotPresent

imagePullSecrets: []

# Session-cookie signing key (used by Starlette SessionMiddleware).
# Generate with `openssl rand -hex 32`. Required.
secretKey: ""

# Postgres 17 connection string for app state. Required.
# Standard RDS Postgres — no custom extensions needed.
# Form: postgresql://USER:PASSWORD@HOST:5432/DBNAME
databaseUrl: ""

# Redis connection string for task queues. Required.
# ElastiCache Redis (TLS) or any Redis 7+ instance.
# Form: rediss://HOST:6379/0  (rediss:// = TLS; redis:// = plaintext)
redisUrl: ""

# OpenSearch connection URL for BM25 full-text search. Required.
# AWS OpenSearch Service: https://admin:pass@vpc-xxx.us-west-2.es.amazonaws.com
# Self-hosted pod:        http://opensearch:9200
opensearchUrl: ""

# Comma-separated email whitelist for signup. Empty = anyone.
allowedEmails: ""

# Per-queue max backlog. New enqueues fail fast with HTTP 503 when a queue
# reaches this size. Applies to all three queues. Default 1000.
maxQueueSize: 1000

# Surface the coding-tool launchers API (/api/launchers, /api/launch,
# /api/agent-sessions). Default off — flip to true once the helper
# package + wiki UI are ready in your environment.
launchersEnabled: false

# Opt-in eval logging — writes one row to ingest_eval_samples per reconciler
# decision (committed / no_change / irrelevant). Off by default; enable on
# environments where you want to collect real traffic for eval review.
ingestEvalLogging: false
# Browser-facing wiki origin (e.g. "https://wiki.example.com", no
# trailing slash). Backend advertises this URL in launcher launch URIs,
# redirect targets, email links. Optional: when left empty the chart
# derives "https://<ingress.host>" (same pattern as auth.oidc.redirectUri).
# Set it only to override that default (cf. GitLab external_url, Sentry
# system.url-prefix).
publicBaseUrl: ""

auth:
  # basic | oidc
  mode: basic
  oidc:
    # Use https://accounts.google.com for Google. The /.well-known/openid-configuration
    # path is appended automatically.
    issuer: ""
    clientId: ""
    clientSecret: ""
    # Must match exactly what's registered with the IdP (e.g. Google Cloud Console
    # OAuth client → Authorized redirect URIs). Defaults to
    # `https://<ingress.host>/api/auth/oidc/callback` when left empty.
    redirectUri: ""

# Set true behind HTTPS. The Ingress section below issues a cert via cert-manager.
secureCookies: true

backend:
  replicaCount: 1
  port: 8080
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  livenessProbe:
    httpGet:
      path: /api/health
      port: http
    initialDelaySeconds: 20
    periodSeconds: 30
  readinessProbe:
    httpGet:
      path: /api/health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10

worker:
  # One Deployment is created per queue; replicaCount applies per queue.
  # Keep at 1 — backend + worker pods share an RWO wiki-data PVC and must
  # co-schedule, AND the per-queue periodic-task scheduler runs in-process
  # (running multiple replicas would double-fire the cron tasks).
  replicaCount: 1
  # Three Redis Stream queues, one consumer process each. Match
  # `backend/app/tasks/queues.py:QUEUES`. Don't add a fourth without
  # corresponding code.
  queues:
    - documents
    - triggers
    - lightweight_maintenance
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

frontend:
  replicaCount: 1
  port: 3000
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

persistence:
  # App state lives in Postgres (DATABASE_URL); task queues in Redis
  # (REDIS_URL). The only volume the workload needs is the wiki working tree.
  wikiData:
    # Git working tree. Mounted at /wiki on backend + worker.
    size: 10Gi
    storageClass: gp3
    accessMode: ReadWriteOnce

ingress:
  enabled: true
  className: nginx
  host: agent-workspace.example.com
  # Set to a configured ClusterIssuer name (e.g. "letsencrypt-prod") to enable TLS.
  # The Terraform stack installs `letsencrypt-prod` if cert_manager_email is set.
  clusterIssuer: ""
  tls:
    enabled: false
    secretName: agent-workspace-tls
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
    # /api/chat and /api/mcp serve `text/event-stream`. With buffering on,
    # the ingress holds events until the response completes — chat
    # streaming and the MCP long-poll both break.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"

serviceAccount:
  create: true
  name: ""
  annotations: {}

podSecurityContext: {}
securityContext: {}

nodeSelector: {}
tolerations: []
affinity: {}

monitoring:
  serviceMonitor:
    # Set to true when kube-prometheus-stack is installed in the cluster.
    enabled: false
    # Extra labels added to the ServiceMonitor — must match the Prometheus
    # Operator's serviceMonitorSelector (if set). Typically {"release": "<helm-release-name>"}.
    labels: {}
