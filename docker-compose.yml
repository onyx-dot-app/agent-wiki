services:
  backend:
    build: ./backend
    env_file: .env
    environment:
      - APP_DB_PATH=/data/app.sqlite
      - QUEUE_DB_PATH=/data/queue.sqlite
      - WIKI_DIR=/data/wiki
    volumes:
      - ./local_data:/data
    expose:
      - "8080"

  # Three workers, one per queue (see backend/app/tasks/huey_app.py).
  # All three share queue.sqlite — Huey namespaces tables by queue name.
  worker-documents:
    build: ./backend
    command: ["python", "-m", "app.tasks.run_worker", "documents"]
    env_file: .env
    environment:
      - APP_DB_PATH=/data/app.sqlite
      - QUEUE_DB_PATH=/data/queue.sqlite
      - WIKI_DIR=/data/wiki
    volumes:
      - ./local_data:/data
    depends_on:
      - backend

  worker-triggers:
    build: ./backend
    command: ["python", "-m", "app.tasks.run_worker", "triggers"]
    env_file: .env
    environment:
      - APP_DB_PATH=/data/app.sqlite
      - QUEUE_DB_PATH=/data/queue.sqlite
      - WIKI_DIR=/data/wiki
    volumes:
      - ./local_data:/data
    depends_on:
      - backend

  worker-wiki-bm25:
    build: ./backend
    command: ["python", "-m", "app.tasks.run_worker", "wiki_bm25"]
    env_file: .env
    environment:
      - APP_DB_PATH=/data/app.sqlite
      - QUEUE_DB_PATH=/data/queue.sqlite
      - WIKI_DIR=/data/wiki
    volumes:
      - ./local_data:/data
    depends_on:
      - backend

  frontend:
    build: ./frontend
    env_file: .env
    expose:
      - "3000"
    depends_on:
      - backend

  nginx:
    build: ./nginx
    ports:
      - "8080:80"
    depends_on:
      - backend
      - frontend
