repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
        # Helm chart templates contain Go templating that isn't valid YAML
        # pre-render; `helm lint` (below) covers those.
        exclude: ^deploy/helm/[^/]+/templates/
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/sirwart/ripsecrets
    rev: v0.1.11
    hooks:
      - id: ripsecrets
        args:
          - --strict-ignore
          - --additional-pattern
          - ^sk-[A-Za-z0-9_\-]{20,}$

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.103.0
    hooks:
      - id: terraform_fmt
        files: \.tf$
      - id: terraform_validate
        files: \.tf$

  - repo: local
    hooks:
      - id: helm-lint
        name: helm lint
        entry: bash -c 'set -euo pipefail; for d in deploy/helm/*/; do [ -f "$d/Chart.yaml" ] && helm lint "$d" --set secretKey=ci-placeholder; done'
        language: system
        files: ^deploy/helm/
        pass_filenames: false

      # Backend Python checks. Local hooks via `uv` so the tool versions
      # match what `uv sync --extra dev` installs from backend/pyproject.toml
      # — no second source of truth for ruff / basedpyright pins.
      - id: ruff
        name: ruff (backend)
        entry: uv run --project backend --extra dev ruff check
        language: system
        files: ^backend/.*\.py$
        pass_filenames: true

      # Frontend checks. Local hooks via `bun` so the tool versions match
      # what `bun install` resolves from frontend/bun.lock — same
      # no-second-source-of-truth rule as the uv hooks above.
      - id: prettier
        name: prettier (frontend)
        # pre-commit passes paths from the repo root; strip the frontend/
        # prefix since we run from inside frontend/.
        entry: bash -c 'cd frontend && bun run prettier --write --ignore-unknown -- "${@#frontend/}"' --
        language: system
        files: ^frontend/src/
        pass_filenames: true

      - id: tsc
        name: tsc (frontend)
        # tsc needs the whole import graph for cross-file errors (same
        # reasoning as basedpyright); incremental cache keeps it sub-second.
        entry: bash -c 'cd frontend && bun run typecheck'
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false

      - id: vitest
        name: vitest (frontend)
        # Editor-behaviour tests (headless Tiptap) — sub-second suite, run
        # whole on any frontend .ts/.tsx change like tsc above.
        entry: bash -c 'cd frontend && bun run test'
        language: system
        files: ^frontend/.*\.(ts|tsx)$
        pass_filenames: false

      - id: basedpyright
        name: basedpyright (backend)
        # basedpyright reads pyproject.toml for include/exclude — passing
        # only changed files would shrink the import graph and miss
        # cross-file errors. Run whole-project on any backend .py change.
        entry: bash -c 'cd backend && uv run --extra dev basedpyright'
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
