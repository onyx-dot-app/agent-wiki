# Alembic config for agent-wiki backend.
#
# We don't set ``sqlalchemy.url`` here — ``app/db/migrations/env.py`` reads
# ``CONFIG.database_url`` so the venv-vs-Docker-vs-tests stories all use the
# same source of truth. ``init_db()`` calls ``alembic upgrade head``
# programmatically; this file is only consulted by the CLI for things like
# ``alembic revision --autogenerate``.

[alembic]
script_location = app/db/migrations
prepend_sys_path = .
# Filenames sort lexically, so the four-digit prefix doubles as ordering.
file_template = %%(rev)s_%%(slug)s
timezone = UTC

# Default Alembic logging config — tests + run_worker.py use ``setup_logging``
# instead, but `alembic` CLI invocations rely on these handlers.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
