[project]
name = "agent-wiki-backend"
version = "0.0.1"
description = "Backend for agent-wiki: a self-updating wiki for AI agents"
requires-python = ">=3.11"
dependencies = [
    "croniter>=2.0",     # cron-spec parsing for periodic background tasks
    "redis>=5.0",        # task queue (Redis Streams)
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.13",     # schema migrations applied on init_db()
    "python-dotenv>=1.0",
    "requests>=2.31",
    "authlib>=1.3",      # OIDC via authlib.integrations.starlette_client
    "bcrypt>=4.1",       # basic auth password hashing
    "anthropic>=0.40",
    "boto3>=1.43.36", # AWS Bedrock (Converse API) provider
    "openai>=1.50",      # Responses API + streaming events
    "google-genai>=1.0", # Gemini provider
    "ollama>=0.4",       # Local-model provider (uses Ollama HTTP API)
    "braintrust>=0.0.190", # LLM tracing — admin-configured project + key
    "pyyaml>=6.0",       # trigger files on disk
    "opensearch-py>=2.4",  # BM25 full-text search
    "prometheus_client>=0.21",
    "prometheus-fastapi-instrumentator>=7.1",
    # Pin FastAPI <0.137: 0.137's lazy router inclusion puts `_IncludedRouter`
    # objects in `app.routes`, which prometheus-fastapi-instrumentator's route
    # walker (get_route_name) can't read (AttributeError: no `.path`). uv.lock is
    # gitignored, so CI resolves fresh — without this bound it floats to the
    # broken 0.137 set. Remove once the instrumentator handles lazy includes.
    "fastapi>=0.110,<0.137",
    "uvicorn[standard]>=0.27",  # ASGI server — production entry via Dockerfile CMD
    "itsdangerous>=2.1", # Starlette SessionMiddleware signs the session cookie
    "onnxruntime>=1.17", # in-process relevance scoring (two-tower ONNX); no torch
    "markdown-it-py>=3.0", # markdown <-> Yjs codec block parsing (app/wiki/markdown_blocks.py)
    "pycrdt>=0.14",         # Python Yjs CRDT implementation — coedit live doc
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    # uv.lock is gitignored, so CI resolves this fresh on every run — an
    # open-ended bound floats to whatever ruff released last (0.16 expanded
    # the default rule set and broke every PR touching a backend file).
    # Keep both bounds tight so local venvs and CI lint identically.
    "ruff>=0.15,<0.16",
    "basedpyright>=1.18",
    "httpx>=0.27",            # fastapi.testclient.TestClient transport
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# PLC0415: imports belong at the top of the file. Function-local imports are
# allowed only as explicit, commented exceptions (lazy cycle-breakers) via
# `# noqa: PLC0415`. Existing sites were frozen with --add-noqa; don't add new
# ones. Tests are exempt until their own sweep.
extend-select = ["PLC0415"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLC0415"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ``-n auto`` runs tests across one process per CPU core via pytest-xdist.
# Tests are parallel-safe: each gets its own Postgres database (see
# ``tests/conftest.py``) and a unique ``tmp_path``; module-level state is
# patched per-test and lives in a worker-local process. ``--dist=loadfile``
# keeps tests in the same file on the same worker so module-scoped fixtures
# (if any are added later) don't get rebuilt across workers.
addopts = "-q -n auto --dist=loadfile"

[tool.basedpyright]
include = ["app", "tests", "evals"]
exclude = [
    "**/__pycache__",
    "**/.venv",
    "app/db/migrations/versions",
]
extraPaths = ["."]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"

typeCheckingMode = "strict"

reportMissingTypeStubs = "none"

reportImplicitOverride = "none"
reportImplicitStringConcatenation = "none"
reportUnannotatedClassAttribute = "none"
reportUnusedCallResult = "none"

reportUnknownParameterType = "error"
reportUnknownArgumentType = "error"
reportUnknownVariableType = "error"
reportUnknownMemberType = "error"
reportMissingParameterType = "error"
reportUntypedFunctionDecorator = "error"
reportUntypedClassDecorator = "error"

[[tool.basedpyright.executionEnvironments]]
root = "tests"
reportUnknownParameterType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownLambdaType = "none"
reportMissingParameterType = "none"
reportMissingTypeArgument = "none"
reportUntypedFunctionDecorator = "none"
reportPrivateUsage = "none"
reportUnusedFunction = "none"
# pycrdt's `.attributes` stub is bytes-keyed but str-keyed at runtime (see
# the executionEnvironments below) — test_markdown_yjs.py hits the same
# mismatch dict()-ing an XmlElement's attributes.
reportArgumentType = "none"
reportCallIssue = "none"

# pycrdt's bundled stubs are loosely typed under strict mode: `Doc` is
# generic with no usable neutral type argument, `.attributes`/`.children`
# are declared with types (bytes-keyed dicts, unions including XmlFragment)
# that don't match verified runtime behavior (str-keyed, always XmlElement
# for our own tree shape). Relaxed here, per-file, same pattern as the
# `tests` override above, rather than scattering `# type: ignore` at every
# call site across the modules that talk to pycrdt directly.
[[tool.basedpyright.executionEnvironments]]
root = "app/wiki/markdown_yjs.py"
reportUnknownParameterType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportUnknownLambdaType = "none"
reportMissingTypeArgument = "none"
reportArgumentType = "none"
reportCallIssue = "none"
reportAttributeAccessIssue = "none"
reportReturnType = "none"
reportUnnecessaryComparison = "none"
reportOperatorIssue = "none"

[[tool.basedpyright.executionEnvironments]]
root = "app/wiki/markdown_splice.py"
reportUnknownParameterType = "none"
reportUnknownArgumentType = "none"
reportUnknownVariableType = "none"
reportUnknownMemberType = "none"
reportMissingTypeArgument = "none"
reportArgumentType = "none"
reportCallIssue = "none"
reportAttributeAccessIssue = "none"
reportReturnType = "none"
reportAssignmentType = "none"
reportUnnecessaryComparison = "none"
reportUnnecessaryContains = "none"

[tool.uv]
# Some transitive deps (e.g. greenlet) publish releases missing Linux wheels;
# require Linux x86_64 so the lock can only resolve to versions installable in
# CI / Docker (which run on Linux), regardless of the resolving host's platform.
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
