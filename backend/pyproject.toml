[project]
name = "agent-workspace-backend"
version = "0.0.1"
description = "Backend for agent-workspace: a self-updating wiki for AI agents"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "huey>=2.5",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "authlib>=1.3",          # OIDC
    "passlib[bcrypt]>=1.7",  # basic auth password hashing
    "anthropic>=0.40",
    "openai>=1.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
