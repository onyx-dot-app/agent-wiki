<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingest Eval Labeler</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f5f0;
    color: #1a1a1a;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Top bar ── */
  .topbar {
    background: #1a1a1a;
    color: #fff;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }
  .topbar h1 { font-size: 15px; font-weight: 600; flex: 1; }
  .progress-text { font-size: 13px; color: #aaa; }
  .topbar button {
    background: #333;
    color: #fff;
    border: 1px solid #555;
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  .topbar button:hover { background: #444; }

  /* ── Load screen ── */
  #load-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 40px;
  }
  #load-screen h2 { font-size: 20px; font-weight: 600; }

  .drop-zone {
    border: 2px dashed #bbb;
    border-radius: 12px;
    padding: 40px 64px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    background: #fff;
  }
  .drop-zone:hover, .drop-zone.drag-over {
    border-color: #1a1a1a;
    background: #eeeee8;
  }
  .drop-zone p { margin-top: 8px; font-size: 13px; color: #888; }
  .drop-zone.drag-over * { pointer-events: none; }
  #file-input { display: none; }
  .load-btn {
    display: inline-block;
    background: #1a1a1a;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 24px;
    font-size: 14px;
    cursor: pointer;
    margin-top: 14px;
  }
  .load-btn:hover { background: #333; }


  /* ── Main labeler ── */
  #labeler { flex: 1; display: none; flex-direction: column; overflow: hidden; }

  .nav-bar {
    background: #fff;
    border-bottom: 1px solid #e0e0e0;
    padding: 10px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .nav-bar button {
    background: #f0f0ee;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  .nav-bar button:hover { background: #e4e4e0; }
  .nav-bar button:disabled { opacity: 0.4; cursor: default; }
  .nav-counter { font-size: 13px; color: #666; flex: 1; text-align: center; }

  /* ── Sample ── */
  .sample-area {
    flex: 1;
    min-height: 0;
    padding: 24px;
    display: flex;
    gap: 20px;
    overflow: hidden;
  }

  .left-panel  { width: 360px; flex-shrink: 0; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
  .left-panel > .card { flex-shrink: 0; }
  .center-panel { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .right-panel  { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  /* Markdown rendering */
  .md-body { font-size: 13px; line-height: 1.65; color: #1a1a1a; }
  .md-body h1,.md-body h2,.md-body h3 { font-weight: 600; margin: 14px 0 6px; }
  .md-body h1 { font-size: 16px; } .md-body h2 { font-size: 14px; } .md-body h3 { font-size: 13px; }
  .md-body p { margin: 6px 0; }
  .md-body ul,.md-body ol { padding-left: 20px; margin: 6px 0; }
  .md-body li { margin: 2px 0; }
  .md-body code { background: #f0f0ee; border-radius: 3px; padding: 1px 4px; font-size: 12px; font-family: monospace; }
  .md-body pre { background: #f7f7f5; border: 1px solid #e0e0e0; border-radius: 6px; padding: 10px; overflow-x: auto; margin: 8px 0; }
  .md-body pre code { background: none; padding: 0; }
  .md-body blockquote { border-left: 3px solid #ddd; padding-left: 10px; color: #666; margin: 6px 0; }
  .md-body hr { border: none; border-top: 1px solid #e0e0e0; margin: 10px 0; }
  .md-body table { border-collapse: collapse; width: 100%; font-size: 12px; }
  .md-body th,.md-body td { border: 1px solid #e0e0e0; padding: 5px 8px; }
  .md-body th { background: #f7f7f5; }

  .card {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 10px;
    overflow: hidden;
  }
  .card-header {
    background: #f7f7f5;
    border-bottom: 1px solid #e0e0e0;
    padding: 10px 16px;
    font-size: 12px;
    font-weight: 600;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .card-body { padding: 16px; }

  .meta-grid {
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 6px 12px;
    font-size: 13px;
  }
  .meta-grid .key { color: #888; white-space: nowrap; }
  .meta-grid .val { word-break: break-all; }
  .meta-grid a { color: #1a1a1a; }

  .outcome-badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
  }
  .outcome-committed { background: #d4f0d4; color: #1a6e1a; }
  .outcome-no_change { background: #e8e8e8; color: #555; }
  .outcome-irrelevant { background: #fde8d0; color: #8b4000; }

  /* ── Diff ── */
  .diff-container {
    font-family: "SF Mono", "Fira Code", monospace;
    font-size: 12px;
    line-height: 1.6;
    overflow: auto;
    max-height: 280px;
  }
  .diff-line { padding: 1px 8px; white-space: pre; }
  .diff-add { background: #e6ffed; color: #1a6e1a; }
  .diff-del { background: #ffebe9; color: #8b0000; }
  .diff-meta { background: #f0f4ff; color: #4a5568; }
  .diff-ctx { color: #444; }
  .diff-header { color: #888; font-style: italic; }
  .no-diff { color: #888; font-size: 13px; font-style: italic; padding: 8px; }

  /* ── Source content ── */
  .source-text {
    font-size: 13px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    color: #333;
    max-height: 300px;
    overflow-y: auto;
  }

  /* ── Labeling panel ── */
  .label-section h3 { font-size: 13px; font-weight: 600; color: #444; margin-bottom: 10px; }

  .label-buttons { display: flex; flex-direction: column; gap: 4px; }
  .label-btn {
    border: 1.5px solid #e0e0e0;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
    background: #fff;
    text-align: left;
    transition: all 0.1s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .label-btn:hover { border-color: #aaa; background: #f7f7f5; }
  .label-btn.selected { border-color: #1a1a1a; background: #1a1a1a; color: #fff; }
  .label-btn .icon { font-size: 13px; }

  .reason-area { margin-top: 4px; }
  .reason-area label { font-size: 12px; color: #888; display: block; margin-bottom: 6px; }
  .reason-area textarea {
    width: 100%;
    border: 1px solid #e0e0e0;
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 13px;
    font-family: inherit;
    resize: vertical;
    min-height: 80px;
    outline: none;
  }
  .reason-area textarea:focus { border-color: #aaa; }

  .save-btn {
    width: 100%;
    background: #1a1a1a;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 11px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 4px;
  }
  .save-btn:hover { background: #333; }
  .save-btn:disabled { background: #ccc; cursor: default; }

  .saved-indicator {
    text-align: center;
    font-size: 12px;
    color: #1a6e1a;
    margin-top: 4px;
    height: 16px;
  }

  /* ── Progress bar ── */
  .progress-bar-wrap { height: 3px; background: #e0e0e0; flex-shrink: 0; }
  .progress-bar-fill { height: 100%; background: #1a1a1a; transition: width 0.3s; }

  /* ── Jump to ── */
  .jump-wrap { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #666; }
  .jump-wrap input {
    width: 52px;
    border: 1px solid #ddd;
    border-radius: 4px;
    padding: 4px 6px;
    font-size: 13px;
    text-align: center;
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

<div class="topbar">
  <h1>Ingest Eval Labeler</h1>
  <span class="progress-text" id="progress-summary"></span>
  <button onclick="saveCheckpoint()">Save checkpoint</button>
</div>

<!-- Load screen -->
<div id="load-screen">
  <h2 style="font-size:20px;font-weight:600;">Load eval samples</h2>
  <div style="margin-top:20px;display:flex;flex-direction:column;align-items:center;gap:10px;">
    <button class="load-btn" id="choose-btn">Choose file…</button>
    <p id="pick-error" style="font-size:12px;color:#c00;display:none;">File picker not supported — use Chrome 86+</p>
  </div>
  <input type="file" id="ckpt-input" style="display:none" onchange="loadCheckpoint(event)">
</div>

<!-- Main labeler -->
<div id="labeler">
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progress-bar"></div>
  </div>
  <div class="nav-bar">
    <div class="nav-counter" id="nav-counter"></div>
    <div class="jump-wrap">
      Jump to <input type="number" id="jump-input" min="1" onchange="jumpTo(this.value)">
    </div>
    <div style="display:flex;gap:6px;">
      <button id="btn-prev" onclick="navigate(-1)">← Prev</button>
      <button id="btn-next" onclick="navigate(1)">Next →</button>
    </div>
  </div>

  <div class="sample-area">

    <!-- Left: meta + diff + label -->
    <div class="left-panel">
      <div class="card">
        <div class="card-header">Sample Info</div>
        <div class="card-body">
          <div class="meta-grid" id="meta-grid"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">Label</div>
        <div class="card-body" style="display:flex;flex-direction:column;gap:14px;">
          <div class="label-buttons" id="label-buttons"></div>
          <div class="reason-area">
            <label>Reason / notes (optional)</label>
            <textarea id="reason-input" placeholder="Why is this good or bad?"></textarea>
          </div>
          <button class="save-btn" id="save-btn" onclick="saveLabel()">Save &amp; Next →</button>
          <div class="saved-indicator" id="saved-indicator"></div>
        </div>
      </div>
    </div>

    <!-- Center: source content (raw) -->
    <div class="center-panel">
      <div class="card" style="flex:1;display:flex;flex-direction:column;">
        <div class="card-header">Source Content</div>
        <div style="padding:10px 16px 0;display:flex;flex-direction:column;gap:3px;border-bottom:1px solid #e0e0e0;background:#f7f7f5;">
          <div id="source-title" style="font-size:13px;font-weight:600;color:#1a1a1a;"></div>
          <div id="source-meta" style="font-size:12px;color:#666;padding-bottom:8px;"></div>
        </div>
        <div class="card-body" style="flex:1;overflow-y:auto;">
          <div class="source-text" id="source-view"></div>
        </div>
      </div>
    </div>

    <!-- Right: wiki before (rendered markdown) -->
    <div class="right-panel">
      <div class="card" style="flex:1;display:flex;flex-direction:column;">
        <div class="card-header">Wiki</div>
        <div style="padding:10px 16px 8px;border-bottom:1px solid #e0e0e0;background:#f7f7f5;">
          <div id="wiki-path" style="font-size:12px;font-weight:500;color:#555;"></div>
        </div>
        <div class="card-body" style="flex:1;overflow-y:auto;">
          <div class="md-body" id="wiki-before-view"></div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
const LABELS = [
  { value: "committed",     icon: "✅", text: "Should commit — edit is correct" },
  { value: "bad_commit",    icon: "⚠️", text: "Should commit — but diff is wrong" },
  { value: "no_change",     icon: "✓",  text: "Should no-change — already up to date" },
  { value: "irrelevant",    icon: "⊘",  text: "Should be irrelevant — wrong page" },
];

let samples = [];   // original rows — never mutated on disk
let current = 0;
let filename = "eval_samples.json";
let labels = {};    // id → { label, reason } — checkpoint state
let storageKey = "";

// ── File loading ──────────────────────────────────────────────────────────────

async function pickFile() {
  if (!window.showOpenFilePicker) {
    document.getElementById("pick-error").style.display = "";
    return;
  }
  try {
    const [handle] = await window.showOpenFilePicker({ multiple: false });
    const file = await handle.getFile();
    filename = file.name;
    initSamples(await file.text());
  } catch (e) {
    if (e.name !== "AbortError") alert("Could not open file: " + e.message);
  }
}

function initSamples(text) {
  const lines = text.trim().split("\n").filter(l => l.trim());
  samples = lines.map(l => JSON.parse(l));
  storageKey = "eval_ckpt_" + filename;
  labels = JSON.parse(localStorage.getItem(storageKey) || "{}");
  current = 0;
  document.getElementById("load-screen").style.display = "none";
  document.getElementById("labeler").style.display = "flex";
  render();
}

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("choose-btn").addEventListener("click", pickFile);
});

// ── Navigation ────────────────────────────────────────────────────────────────

function navigate(delta) {
  const next = current + delta;
  if (next < 0 || next >= samples.length) return;
  current = next;
  render();
}

function jumpTo(val) {
  const idx = parseInt(val) - 1;
  if (isNaN(idx) || idx < 0 || idx >= samples.length) return;
  current = idx;
  render();
}

// ── Render ────────────────────────────────────────────────────────────────────

function render() {
  const s = samples[current];

  document.getElementById("nav-counter").textContent = `${current + 1} of ${samples.length}`;
  document.getElementById("btn-prev").disabled = current === 0;
  document.getElementById("btn-next").disabled = current === samples.length - 1;
  document.getElementById("jump-input").value = current + 1;

  const labeled = Object.keys(labels).length;
  document.getElementById("progress-bar").style.width = (labeled / samples.length * 100) + "%";
  document.getElementById("progress-summary").textContent = `${labeled} / ${samples.length} labeled`;

  const outcome = s.outcome || "";
  document.getElementById("source-title").textContent = s.source_title || "";
  document.getElementById("source-meta").innerHTML =
    (s.source_type ? `<span>${esc(s.source_type)}</span> · ` : "") +
    (s.source_url ? `<a href="${esc(s.source_url)}" target="_blank" style="color:#555;">${esc(s.source_url)}</a>` : "");
  document.getElementById("wiki-path").textContent = s.wiki_path || "";
  document.getElementById("meta-grid").innerHTML = `
    <span class="key">ID</span><span class="val">${s.id}</span>
    <span class="key">Date</span><span class="val">${s.created_at || "—"}</span>
    <span class="key">Outcome</span><span class="val">
      <span class="outcome-badge outcome-${outcome}">${outcome}</span>
    </span>
    ${s.commit_sha ? `<span class="key">Commit</span><span class="val">${s.commit_sha.slice(0,8)}</span>` : ""}
  `;

renderContent(document.getElementById("source-view"), s.source_content || "");
  renderWikiBefore(document.getElementById("wiki-before-view"), s.wiki_body_before || "", s.diff || null);

  const btnsEl = document.getElementById("label-buttons");
  btnsEl.innerHTML = "";
  const saved = labels[s.id] || {};
  LABELS.forEach(l => {
    const btn = document.createElement("button");
    btn.className = "label-btn" + (saved.label === l.value ? " selected" : "");
    btn.innerHTML = `<span class="icon">${l.icon}</span>${l.text}`;
    btn.onclick = () => selectLabel(l.value);
    btnsEl.appendChild(btn);
  });

  document.getElementById("reason-input").value = saved.reason || "";
  document.getElementById("saved-indicator").textContent = saved.label ? "✓ Labeled" : "";
  document.getElementById("save-btn").textContent =
    current < samples.length - 1 ? "Save & Next →" : "Save";
}

function selectLabel(value) {
  const id = samples[current].id;
  labels[id] = { ...(labels[id] || {}), label: value };
  persistCheckpoint();
  render();
}

function saveLabel() {
  const id = samples[current].id;
  const reason = document.getElementById("reason-input").value.trim();
  labels[id] = { ...(labels[id] || {}), reason: reason || undefined };
  persistCheckpoint();
  document.getElementById("saved-indicator").textContent = "✓ Saved";
  setTimeout(() => {
    if (current < samples.length - 1) navigate(1);
  }, 200);
}

// ── Checkpoint ────────────────────────────────────────────────────────────────

function persistCheckpoint() {
  if (storageKey) localStorage.setItem(storageKey, JSON.stringify(labels));
}

function saveCheckpoint() {
  const blob = new Blob([JSON.stringify(labels, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename.replace(/\.[^.]+$/, "") + "_labels.json";
  a.click();
}

function loadCheckpoint(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    labels = JSON.parse(ev.target.result);
    persistCheckpoint();
    if (samples.length) render();
  };
  reader.readAsText(file);
}

// ── Wiki before with inline diff highlights ───────────────────────────────────

function renderWikiBefore(el, wikiBody, diff) {
  el.className = "md-body";
  el.removeAttribute("style");

  if (!diff) {
    el.innerHTML = marked.parse(wikiBody);
    return;
  }

  const lines = wikiBody.split("\n");

  // Parse diff into hunks: [{removedStart, removed:[], added:[]}]
  const hunks = [];
  let cur = null, origIdx = -1;
  for (const dl of diff.split("\n")) {
    if (dl.startsWith("@@")) {
      const m = dl.match(/@@ -(\d+)/);
      if (m) { origIdx = parseInt(m[1]) - 1; cur = { removedStart: origIdx, removed: [], added: [] }; hunks.push(cur); }
    } else if (/^(---|[+]{3}|commit |Author:|Date:|diff |index )/.test(dl)) {
      // skip git header lines
    } else if (dl.startsWith("-") && cur) {
      cur.removed.push(dl.slice(1)); origIdx++;
    } else if (dl.startsWith("+") && cur) {
      cur.added.push(dl.slice(1));
    } else {
      origIdx++;
    }
  }

  // Build HTML: unchanged segments → markdown, hunk lines → highlighted blocks
  let html = "";
  let pos = 0;
  for (const h of hunks) {
    if (pos < h.removedStart) {
      html += marked.parse(lines.slice(pos, h.removedStart).join("\n"));
    }
    for (const t of h.removed) {
      html += `<div style="background:#ffebe9;font-family:monospace;font-size:12px;line-height:1.6;padding:1px 6px;">${esc(t)||"&nbsp;"}</div>`;
    }
    for (const t of h.added) {
      html += `<div style="background:#e6ffed;font-family:monospace;font-size:12px;line-height:1.6;padding:1px 6px;">${esc(t)||"&nbsp;"}</div>`;
    }
    pos = h.removedStart + h.removed.length;
  }
  if (pos < lines.length) html += marked.parse(lines.slice(pos).join("\n"));

  el.innerHTML = html;
}

// ── Content renderer (markdown if detectable, else plain text) ────────────────

function renderContent(el, text) {
  const looksLikeMarkdown = /^#{1,6}\s|\*\*.+\*\*|^\s*[-*+]\s|^\s*\d+\.\s|`[^`\n]+`|\[.+\]\(.+\)|^>\s/m.test(text);
  if (looksLikeMarkdown) {
    el.className = "md-body";
    el.innerHTML = marked.parse(text);
  } else {
    el.className = "source-text";
    el.textContent = text;
  }
}

// ── Diff renderer ─────────────────────────────────────────────────────────────

function renderDiff(diff) {
  return diff.split("\n").map(line => {
    if (line.startsWith("+++") || line.startsWith("---")) {
      return `<div class="diff-line diff-header">${esc(line)}</div>`;
    } else if (line.startsWith("@@")) {
      return `<div class="diff-line diff-meta">${esc(line)}</div>`;
    } else if (line.startsWith("+")) {
      return `<div class="diff-line diff-add">${esc(line)}</div>`;
    } else if (line.startsWith("-")) {
      return `<div class="diff-line diff-del">${esc(line)}</div>`;
    } else if (line.startsWith("commit") || line.startsWith("Author") || line.startsWith("Date")) {
      return `<div class="diff-line diff-header">${esc(line)}</div>`;
    } else {
      return `<div class="diff-line diff-ctx">${esc(line)}</div>`;
    }
  }).join("");
}

// ── Util ──────────────────────────────────────────────────────────────────────

function esc(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

// Keyboard shortcuts
document.addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
  if (e.key === "ArrowLeft")  navigate(-1);
  if (e.key === "ArrowRight") navigate(1);
  if (e.key === "1") selectLabel("committed");
  if (e.key === "2") selectLabel("bad_commit");
  if (e.key === "3") selectLabel("no_change");
  if (e.key === "4") selectLabel("irrelevant");
  if (e.key === "Enter") saveLabel();
});
</script>
</body>
</html>
