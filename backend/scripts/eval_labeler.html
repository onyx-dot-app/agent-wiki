<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingest Eval Labeler</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f5f0;
    color: #1a1a1a;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Top bar ── */
  .topbar {
    background: #1a1a1a;
    color: #fff;
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }
  .topbar h1 { font-size: 15px; font-weight: 600; flex: 1; }
  .progress-text { font-size: 13px; color: #aaa; }
  .topbar button {
    background: #333;
    color: #fff;
    border: 1px solid #555;
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  .topbar button:hover { background: #444; }

  /* ── Load screen ── */
  #load-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 40px;
  }
  #load-screen h2 { font-size: 20px; font-weight: 600; }

  .load-btn {
    display: inline-block;
    background: #1a1a1a;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 10px 24px;
    font-size: 14px;
    cursor: pointer;
    margin-top: 14px;
  }
  .load-btn:hover { background: #333; }


  /* ── Main labeler ── */
  #labeler { flex: 1; display: none; flex-direction: column; overflow: hidden; }

  .nav-bar {
    background: #fff;
    border-bottom: 1px solid #e0e0e0;
    padding: 10px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }
  .nav-bar button {
    background: #f0f0ee;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  .nav-bar button:hover { background: #e4e4e0; }
  .nav-bar button:disabled { opacity: 0.4; cursor: default; }
  .nav-counter { font-size: 13px; color: #666; flex: 1; text-align: center; }

  /* ── Sample ── */
  .sample-area {
    flex: 1;
    min-height: 0;
    padding: 24px;
    display: flex;
    gap: 20px;
    overflow: hidden;
  }

  .left-panel  { width: 360px; flex-shrink: 0; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
  .left-panel > .card { flex-shrink: 0; }
  .center-panel { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .right-panel  { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  /* Markdown rendering */
  .md-body { font-size: 13px; line-height: 1.65; color: #1a1a1a; }
  .md-body h1,.md-body h2,.md-body h3 { font-weight: 600; margin: 14px 0 6px; }
  .md-body h1 { font-size: 16px; } .md-body h2 { font-size: 14px; } .md-body h3 { font-size: 13px; }
  .md-body p { margin: 6px 0; }
  .md-body ul,.md-body ol { padding-left: 20px; margin: 6px 0; }
  .md-body li { margin: 2px 0; }
  .md-body code { background: #f0f0ee; border-radius: 3px; padding: 1px 4px; font-size: 12px; font-family: monospace; }
  .md-body pre { background: #f7f7f5; border: 1px solid #e0e0e0; border-radius: 6px; padding: 10px; overflow-x: auto; margin: 8px 0; }
  .md-body pre code { background: none; padding: 0; }
  .md-body blockquote { border-left: 3px solid #ddd; padding-left: 10px; color: #666; margin: 6px 0; }
  .md-body hr { border: none; border-top: 1px solid #e0e0e0; margin: 10px 0; }
  .md-body table { border-collapse: collapse; width: 100%; font-size: 12px; }
  .md-body th,.md-body td { border: 1px solid #e0e0e0; padding: 5px 8px; }
  .md-body th { background: #f7f7f5; }

  .card {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 10px;
    overflow: hidden;
  }
  .card-header {
    background: #f7f7f5;
    border-bottom: 1px solid #e0e0e0;
    padding: 10px 16px;
    font-size: 12px;
    font-weight: 600;
    color: #666;
    letter-spacing: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .card-body { padding: 16px; }

  .meta-grid {
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 6px 12px;
    font-size: 13px;
  }
  .meta-grid .key { color: #888; white-space: nowrap; }
  .meta-grid .val { word-break: break-all; }
  .meta-grid a { color: #1a1a1a; }

  .outcome-badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
  }
  .outcome-committed { background: #d4f0d4; color: #1a6e1a; }
  .outcome-no_change { background: #e8e8e8; color: #555; }
  .outcome-irrelevant { background: #fde8d0; color: #8b4000; }

  /* ── Summary callout ── */
  .summary-box {
    background: #f0f4ff;
    border: 1px solid #c8d8f8;
    border-radius: 7px;
    padding: 10px 14px;
    font-size: 12px;
    line-height: 1.6;
    color: #2a3a5a;
    flex-shrink: 0;
    margin-bottom: 12px;
  }
  .summary-box strong { font-weight: 600; display: block; margin-bottom: 3px; font-size: 11px; color: #4a6090; }

  /* ── Judge suggestion ── */
  .judge-box {
    background: #fffbf0;
    border: 1px solid #f0d080;
    border-radius: 7px;
    padding: 10px 14px;
    font-size: 12px;
    line-height: 1.6;
    color: #5a4a00;
  }
  .judge-box strong { font-weight: 600; display: block; margin-bottom: 4px; font-size: 11px; color: #8a6a00; }
  .judge-badge {
    display: inline-block;
    background: #f0d080;
    color: #5a4a00;
    border-radius: 4px;
    padding: 1px 7px;
    font-size: 11px;
    font-weight: 600;
    margin-bottom: 5px;
  }

  /* ── Source content ── */
  .source-text {
    font-size: 13px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    color: #333;
    max-height: 300px;
    overflow-y: auto;
  }

  /* ── Labeling panel ── */
  .label-section h3 { font-size: 13px; font-weight: 600; color: #444; margin-bottom: 10px; }

  .label-buttons { display: flex; flex-direction: column; gap: 4px; }
  .label-btn {
    border: 1.5px solid #e0e0e0;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
    background: #fff;
    text-align: left;
    transition: all 0.1s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .label-btn:hover { border-color: #aaa; background: #f7f7f5; }
  .label-btn.selected { border-color: #1a1a1a; background: #1a1a1a; color: #fff; }
  .label-btn .icon { font-size: 13px; }

  .coverage-area { margin-top: 4px; }
  .coverage-area label { font-size: 12px; color: #888; display: block; margin-bottom: 6px; }
  .coverage-area textarea {
    width: 100%;
    border: 1px solid #e0e0e0;
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 13px;
    font-family: inherit;
    resize: vertical;
    min-height: 80px;
    outline: none;
  }
  .coverage-area textarea:focus { border-color: #aaa; }

  .save-btn {
    width: 100%;
    background: #1a1a1a;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 11px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 4px;
  }
  .save-btn:hover { background: #333; }
  .save-btn:disabled { background: #ccc; cursor: default; }

  .saved-indicator {
    text-align: center;
    font-size: 12px;
    color: #1a6e1a;
    margin-top: 4px;
    height: 16px;
  }

  /* ── Progress bar ── */
  .progress-bar-wrap { height: 3px; background: #e0e0e0; flex-shrink: 0; }
  .progress-bar-fill { height: 100%; background: #1a1a1a; transition: width 0.3s; }

  /* ── Jump to ── */
  .jump-wrap { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #666; }
  .jump-wrap input {
    width: 52px;
    border: 1px solid #ddd;
    border-radius: 4px;
    padding: 4px 6px;
    font-size: 13px;
    text-align: center;
  }
</style>

<body>

<div class="topbar">
  <h1>Ingest Eval Labeler</h1>
  <span class="progress-text" id="progress-summary"></span>
  <button id="api-key-btn" onclick="promptApiKey()" style="display:none;">⚙ Set API key</button>
  <span id="save-status" style="font-size:12px;color:#aaa;"></span>
</div>

<!-- API key modal -->
<div id="api-modal" style="display:none;position:fixed;inset:0;background:rgba(15,15,15,0.45);z-index:100;align-items:center;justify-content:center;">
  <div style="background:#fff;border-radius:12px;padding:28px;width:360px;box-shadow:0 8px 40px rgba(0,0,0,0.18);">
    <h3 style="font-size:15px;font-weight:600;margin-bottom:8px;">Anthropic API key</h3>
    <p style="font-size:12px;color:#888;margin-bottom:16px;">Used for AI summaries. Kept in memory only — cleared when you close the tab.</p>
    <input type="password" id="api-modal-input" placeholder="sk-ant-…"
      onkeydown="if(event.key==='Enter')closeApiModal(true);if(event.key==='Escape')closeApiModal(false);"
      style="width:100%;border:1px solid #ddd;border-radius:6px;padding:9px 11px;font-size:13px;font-family:inherit;outline:none;margin-bottom:16px;">
    <div style="display:flex;justify-content:flex-end;gap:8px;">
      <button onclick="closeApiModal(false)" style="background:#f0f0ee;border:1px solid #ddd;border-radius:6px;padding:7px 16px;font-size:13px;cursor:pointer;">Cancel</button>
      <button onclick="closeApiModal(true)" style="background:#1a1a1a;color:#fff;border:none;border-radius:6px;padding:7px 16px;font-size:13px;cursor:pointer;">Save</button>
    </div>
  </div>
</div>

<!-- Load screen -->
<div id="load-screen">
  <h2 style="font-size:20px;font-weight:600;">Load eval samples</h2>
  <div style="margin-top:20px;display:flex;flex-direction:column;align-items:center;gap:10px;">
    <button class="load-btn" id="choose-btn">Choose file…</button>
    <p id="pick-error" style="font-size:12px;color:#c00;display:none;">File picker not supported — use Chrome 86+</p>
  </div>
</div>

<!-- Main labeler -->
<div id="labeler">
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progress-bar"></div>
  </div>
  <div class="nav-bar">
    <div class="nav-counter" id="nav-counter"></div>
    <div class="jump-wrap">
      Jump to <input type="number" id="jump-input" min="1" onchange="jumpTo(this.value)">
    </div>
    <div style="display:flex;gap:6px;align-items:center;">
      <span style="font-size:11px;color:#999;">Jump to unlabeled:</span>
      <button onclick="jumpToUnlabeled('committed')">committed</button>
      <button onclick="jumpToUnlabeled('no_change')">no_change</button>
      <button onclick="jumpToUnlabeled('irrelevant')">irrelevant</button>
    </div>
    <div style="display:flex;gap:6px;align-items:center;border-left:1px solid #e0e0e0;padding-left:10px;">
      <button onclick="jumpToMismatch()">⚡ mismatch</button>
      <span id="mismatch-count" style="font-size:11px;color:#999;"></span>
    </div>
    <div style="display:flex;gap:6px;align-items:center;">
      <span style="font-size:11px;color:#999;">Judge all:</span>
      <button onclick="judgeAll('committed')">committed</button>
      <button onclick="judgeAll('no_change')">no_change</button>
      <button onclick="judgeAll('irrelevant')">irrelevant</button>
      <span id="judge-queue-status" style="font-size:11px;color:#999;"></span>
    </div>
    <div style="display:flex;gap:6px;">
      <button id="btn-judge" onclick="judgeCurrent()" style="display:none;">⚖ Judge</button>
      <button id="btn-summarize" onclick="summarizeCurrent()" style="display:none;">✦ Summarize</button>
      <button id="btn-prev" onclick="navigate(-1)">← Prev</button>
      <button id="btn-next" onclick="navigate(1)">Next →</button>
    </div>
  </div>

  <div class="sample-area">

    <!-- Left: meta + diff + label -->
    <div class="left-panel">
      <div class="card">
        <div class="card-header">Sample Info</div>
        <div class="card-body">
          <div class="meta-grid" id="meta-grid"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-header">Label</div>
        <div class="card-body" style="display:flex;flex-direction:column;gap:14px;">
          <div class="judge-box" id="judge-box" style="display:none;"></div>
          <div class="label-buttons" id="label-buttons"></div>
          <div class="coverage-area" id="coverage-area" style="display:none;">
            <label>What should this update cover?</label>
            <textarea id="coverage-input" placeholder="Describe the information that should be written to the wiki page…"></textarea>
          </div>
          <button class="save-btn" id="save-btn" onclick="saveLabel()">Save &amp; Next →</button>
          <div class="saved-indicator" id="saved-indicator"></div>
        </div>
      </div>
    </div>

    <!-- Center: source content (raw) -->
    <div class="center-panel">
      <div class="card" style="flex:1;display:flex;flex-direction:column;">
        <div class="card-header">Source Content</div>
        <div style="padding:10px 16px 0;display:flex;flex-direction:column;gap:3px;border-bottom:1px solid #e0e0e0;background:#f7f7f5;">
          <div id="source-title" style="font-size:13px;font-weight:600;color:#1a1a1a;"></div>
          <div id="source-meta" style="font-size:12px;color:#666;padding-bottom:8px;"></div>
        </div>
        <div class="card-body" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;">
          <div class="summary-box" id="source-summary" style="display:none;"></div>
          <div class="source-text" id="source-view"></div>
        </div>
      </div>
    </div>

    <!-- Right: wiki before (rendered markdown) -->
    <div class="right-panel">
      <div class="card" style="flex:1;display:flex;flex-direction:column;">
        <div class="card-header">Wiki</div>
        <div style="padding:10px 16px 8px;border-bottom:1px solid #e0e0e0;background:#f7f7f5;">
          <div id="wiki-path" style="font-size:12px;font-weight:500;color:#555;"></div>
        </div>
        <div class="card-body" style="flex:1;overflow-y:auto;display:flex;flex-direction:column;">
          <div class="summary-box" id="wiki-summary" style="display:none;"></div>
          <div class="md-body" id="wiki-before-view"></div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
const LABELS = [
  { value: "committed_critical",  icon: "🔴", text: "Should commit — critical" },
  { value: "committed_moderate",  icon: "🟡", text: "Should commit — moderate" },
  { value: "committed_nit",       icon: "🟢", text: "Should commit — nit" },
  { value: "no_change_covered",   icon: "✓",  text: "Should no-change — already covered" },
  { value: "no_change_extra",     icon: "↩",  text: "Should no-change — extra info, not worth inclusion" },
  { value: "irrelevant",          icon: "⊘",  text: "Should be irrelevant — wrong selection" },
];

const isCommit = v => v && (v.startsWith("committed_") || v === "committed");

let judgeQueue = [];
let judgeQueueRunning = false;

let samples = [];   // original rows
let current = 0;
let filename = "eval_samples.jsonl";
let fileHandle = null;  // FileSystemFileHandle — used to write back
let enriching = new Set();
let judging   = new Set();
let anthropicKey = "";

// ── File loading ──────────────────────────────────────────────────────────────

async function pickFile() {
  if (!window.showOpenFilePicker) {
    document.getElementById("pick-error").style.display = "";
    return;
  }
  try {
    const [handle] = await window.showOpenFilePicker({ multiple: false });
    fileHandle = handle;
    const file = await handle.getFile();
    filename = file.name;
    initSamples(await file.text());
  } catch (e) {
    if (e.name !== "AbortError") alert("Could not open file: " + e.message);
  }
}

function initSamples(text) {
  const lines = text.trim().split("\n").filter(l => l.trim());
  samples = lines.map(l => JSON.parse(l));
  document.getElementById("api-key-btn").style.display = "";
  current = 0;
  document.getElementById("load-screen").style.display = "none";
  document.getElementById("labeler").style.display = "flex";
  render();
}

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("choose-btn").addEventListener("click", pickFile);
});

// ── Navigation ────────────────────────────────────────────────────────────────

function flushCoverage() {
  if (!samples.length) return;
  const s = samples[current];
  if (isCommit(s.label)) {
    const v = document.getElementById("coverage-input").value.trim();
    if (v) s.coverage = v; else delete s.coverage;
    writeBack();
  }
}

function navigate(delta) {
  flushCoverage();
  const next = current + delta;
  if (next < 0 || next >= samples.length) return;
  current = next;
  render();
}

function jumpTo(val) {
  flushCoverage();
  const idx = parseInt(val) - 1;
  if (isNaN(idx) || idx < 0 || idx >= samples.length) return;
  current = idx;
  render();
}

function jumpToUnlabeled(outcome) {
  flushCoverage();
  for (let i = 1; i <= samples.length; i++) {
    const idx = (current + i) % samples.length;
    if (samples[idx].outcome === outcome && !samples[idx].label) {
      current = idx; render(); return;
    }
  }
}

function jumpToMismatch() {
  flushCoverage();
  for (let i = 1; i <= samples.length; i++) {
    const idx = (current + i) % samples.length;
    const s = samples[idx];
    if (s.judge_label && s.label && s.judge_label !== s.label) {
      current = idx; render(); return;
    }
  }
}

function judgeAll(outcome) {
  if (!anthropicKey) { promptApiKey(); return; }
  const pending = samples.filter(s => s.outcome === outcome && !s.judge_label && !judging.has(s.id));
  pending.forEach(s => { if (!judgeQueue.includes(s.id)) judgeQueue.push(s.id); });
  document.getElementById("judge-queue-status").textContent =
    judgeQueue.length ? `${judgeQueue.length} queued…` : "";
  if (!judgeQueueRunning) processJudgeQueue();
}

async function processJudgeQueue() {
  judgeQueueRunning = true;
  while (judgeQueue.length) {
    document.getElementById("judge-queue-status").textContent = `${judgeQueue.length} remaining…`;
    const id = judgeQueue.shift();
    const sample = samples.find(s => s.id === id);
    if (sample && !sample.judge_label) await judgeSample(sample);
  }
  judgeQueueRunning = false;
  document.getElementById("judge-queue-status").textContent = "";
}

// ── Render ────────────────────────────────────────────────────────────────────

function render() {
  const s = samples[current];

  document.getElementById("nav-counter").textContent = `${current + 1} of ${samples.length}`;
  document.getElementById("btn-prev").disabled = current === 0;
  document.getElementById("btn-next").disabled = current === samples.length - 1;
  document.getElementById("jump-input").value = current + 1;

  const labeled = samples.filter(x => x.label).length;
  document.getElementById("progress-bar").style.width = (labeled / samples.length * 100) + "%";
  const outcomeStats = ["committed", "no_change", "irrelevant"].map(o => {
    const total = samples.filter(x => x.outcome === o).length;
    const done  = samples.filter(x => x.outcome === o && x.label).length;
    return `${o}: ${done}/${total}`;
  }).join(" · ");
  document.getElementById("progress-summary").textContent =
    `${labeled} / ${samples.length} labeled  |  ${outcomeStats}`;

  const mismatches = samples.filter(x => x.judge_label && x.label && x.judge_label !== x.label).length;
  const judged     = samples.filter(x => x.judge_label && x.label).length;
  document.getElementById("mismatch-count").textContent =
    judged ? `${mismatches} / ${judged} mismatch` : "";

  const outcome = s.outcome || "";
  document.getElementById("source-title").textContent = s.source_title || "";
  document.getElementById("source-meta").innerHTML =
    (s.source_type ? `<span>${esc(s.source_type)}</span> · ` : "") +
    (s.source_url ? `<a href="${esc(s.source_url)}" target="_blank" style="color:#555;">${esc(s.source_url)}</a>` : "");
  document.getElementById("wiki-path").textContent = s.wiki_path || "";
  document.getElementById("meta-grid").innerHTML = `
    <span class="key">ID</span><span class="val">${s.id}</span>
    <span class="key">Date</span><span class="val">${s.created_at || "—"}</span>
    <span class="key">Outcome</span><span class="val">
      <span class="outcome-badge outcome-${outcome}">${outcome}</span>
    </span>
    ${s.commit_sha ? `<span class="key">Commit</span><span class="val">${s.commit_sha.slice(0,8)}</span>` : ""}
  `;

  renderContent(document.getElementById("source-view"), s.source_content || "");
  renderWikiBefore(document.getElementById("wiki-before-view"), s.wiki_body_before || "", s.diff || null);

  const loading = enriching.has(s.id);
  renderSummary("source-summary", "Summary", s.source_summary, loading);
  renderSummary("wiki-summary",
    s.diff_summary ? `Summary · <span style="color:#1a6e1a;">Edit: ${esc(s.diff_summary)}</span>` : "Summary",
    s.wiki_summary, loading);

  document.getElementById("btn-summarize").style.display = loading ? "none" : "";

  // Judge suggestion box
  const isJudging = judging.has(s.id);
  document.getElementById("btn-judge").style.display = isJudging ? "none" : "";
  const judgeEl = document.getElementById("judge-box");
  if (isJudging && !s.judge_label) {
    judgeEl.style.display = "";
    judgeEl.innerHTML = `<strong>⚖ Judge</strong><span style="color:#999;font-style:italic;">Judging…</span>`;
  } else if (s.judge_label) {
    const jl = LABELS.find(l => l.value === s.judge_label);
    judgeEl.style.display = "";
    judgeEl.innerHTML = `<strong>⚖ Judge suggestion</strong><span class="judge-badge">${jl ? jl.icon + " " + jl.text : esc(s.judge_label)}</span><div style="color:#6a5800;margin-top:2px;">${esc(s.judge_reasoning || "")}</div>`;
  } else {
    judgeEl.style.display = "none";
  }

  const btnsEl = document.getElementById("label-buttons");
  btnsEl.innerHTML = "";
  LABELS.forEach(l => {
    const btn = document.createElement("button");
    btn.className = "label-btn" + (s.label === l.value ? " selected" : "");
    btn.innerHTML = `<span class="icon">${l.icon}</span>${l.text}`;
    btn.onclick = () => selectLabel(l.value);
    btnsEl.appendChild(btn);
  });

  document.getElementById("coverage-input").value = s.coverage || "";
  document.getElementById("coverage-area").style.display = isCommit(s.label) ? "" : "none";
  document.getElementById("saved-indicator").textContent = s.label ? "✓ Labeled" : "";
  document.getElementById("save-btn").textContent =
    current < samples.length - 1 ? "Save & Next →" : "Save";
}

function selectLabel(value) {
  const s = samples[current];
  s.label = value;
  document.getElementById("coverage-area").style.display = isCommit(value) ? "" : "none";
  if (!isCommit(value)) {
    delete s.coverage;
    document.getElementById("coverage-input").value = "";
  }
  writeBack();
  render();
}

function saveLabel() {
  const s = samples[current];
  const coverage = document.getElementById("coverage-input").value.trim();
  if (isCommit(s.label)) {
    if (coverage) s.coverage = coverage; else delete s.coverage;
  } else {
    delete s.coverage;
  }
  writeBack();
  document.getElementById("saved-indicator").textContent = "✓ Saved";
  setTimeout(() => {
    if (current < samples.length - 1) navigate(1);
  }, 200);
}

// ── File write-back ───────────────────────────────────────────────────────────

async function writeBack() {
  if (!fileHandle) return;
  const statusEl = document.getElementById("save-status");
  statusEl.textContent = "Saving…";
  try {
    const writable = await fileHandle.createWritable();
    await writable.write(samples.map(s => JSON.stringify(s)).join("\n") + "\n");
    await writable.close();
    statusEl.textContent = "Saved ✓";
    setTimeout(() => { if (statusEl.textContent === "Saved ✓") statusEl.textContent = ""; }, 2000);
  } catch (e) {
    statusEl.textContent = "Save failed: " + e.message;
    console.error("writeBack failed:", e);
  }
}

// ── Summary callout ───────────────────────────────────────────────────────────

function renderSummary(id, label, text, loading) {
  const el = document.getElementById(id);
  if (loading && !text) {
    el.style.display = "";
    el.innerHTML = `<strong>${label}</strong><span style="color:#999;font-style:italic;">Generating…</span>`;
    return;
  }
  if (!text) { el.style.display = "none"; return; }
  el.style.display = "";
  el.innerHTML = `<strong>${label}</strong>${esc(text)}`;
}

// ── LLM enrichment ───────────────────────────────────────────────────────────
// This file runs entirely in the browser (file:// or static serve), so it
// cannot go through the backend LLM client. The direct Anthropic fetch here
// is intentional and scoped to this offline eval tool only.

function summarizeCurrent() {
  const s = samples[current];
  if (enriching.has(s.id)) return;
  if (!anthropicKey) { promptApiKey(); return; }
  enrichSample(s);
}

async function enrichSample(sample) {
  enriching.add(sample.id);
  render();  // show "Generating…"

  const SOURCE_MAX = 6000, WIKI_MAX = 6000, DIFF_MAX = 3000;
  const src  = (sample.source_content   || "").slice(0, SOURCE_MAX);
  const wiki = (sample.wiki_body_before || "").slice(0, WIKI_MAX);
  const diff = (sample.diff             || "").slice(0, DIFF_MAX) || null;

  const fields = diff
    ? '"source_summary":"...","wiki_summary":"...","diff_summary":"..."'
    : '"source_summary":"...","wiki_summary":"..."';
  const diffLine = diff ? "diff_summary: 1-2 sentences on what the committed edit adds or changes." : "";
  const userMsg = [
    `<source_document>\n${src}\n</source_document>`,
    `<wiki_page_before>\n${wiki}\n</wiki_page_before>`,
    diff ? `<diff>\n${diff}\n</diff>` : "",
  ].filter(Boolean).join("\n\n")
    + `\n\nRespond with JSON only: {${fields}}\nsource_summary: 2-3 sentences on what the source document is about.\nwiki_summary: 2-3 sentences on what the wiki page currently covers.\n${diffLine}`.trimEnd();

  let errorMsg = null;
  try {
    const resp = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "x-api-key": anthropicKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
        "content-type": "application/json",
      },
      body: JSON.stringify({
        model: "claude-haiku-4-5-20251001",
        max_tokens: 512,
        system: "You are a concise technical summarizer. Reply only with the requested JSON object.",
        messages: [{ role: "user", content: userMsg }],
      }),
    });
    const data = await resp.json();
    if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));
    let text = data.content?.[0]?.text?.trim() || "";
    if (text.startsWith("```")) text = text.replace(/^```[^\n]*\n/, "").replace(/\n```[\s\S]*$/, "").trim();
    const parsed = JSON.parse(text);
    const idx = samples.findIndex(s => s.id === sample.id);
    if (idx !== -1) {
      samples[idx].source_summary = parsed.source_summary || null;
      samples[idx].wiki_summary   = parsed.wiki_summary   || null;
      if (parsed.diff_summary) samples[idx].diff_summary = parsed.diff_summary;

      // Propagate to other samples with identical content (don't overwrite existing)
      samples.forEach((s, i) => {
        if (i === idx) return;
        if (!s.source_summary && s.source_content === sample.source_content)
          s.source_summary = parsed.source_summary || null;
        if (!s.wiki_summary && s.wiki_path === sample.wiki_path && s.wiki_body_before === sample.wiki_body_before)
          s.wiki_summary = parsed.wiki_summary || null;
      });
    }
    await writeBack();
  } catch (e) {
    console.error("enrich failed for id", sample.id, e);
    errorMsg = e.message || String(e);
  } finally {
    enriching.delete(sample.id);
    if (samples[current]?.id === sample.id) {
      if (errorMsg) {
        const box = document.getElementById("source-summary");
        box.style.display = "";
        box.style.background = "#fff0f0";
        box.style.borderColor = "#fcc";
        box.innerHTML = `<strong style="color:#c00;">Summary error</strong>${esc(errorMsg)}`;
      } else {
        render();
      }
    }
  }
}

// ── LLM judge ────────────────────────────────────────────────────────────────
// Judge sees only source + wiki (no diff/outcome) to make an independent call.

function judgeCurrent() {
  const s = samples[current];
  if (judging.has(s.id)) return;
  if (!anthropicKey) { promptApiKey(); return; }
  judgeSample(s);
}

async function judgeSample(sample) {
  judging.add(sample.id);
  render();

  const labelList = LABELS.map(l => `"${l.value}"`).join(", ");
  const userMsg = [
    `<source_document>\n${(sample.source_content || "").slice(0, 6000)}\n</source_document>`,
    `<wiki_page>\n${(sample.wiki_body_before || "").slice(0, 6000)}\n</wiki_page>`,
    `\nGiven the source document and the wiki page above, decide what the correct reconciler action should be.\n\n` +
    `Wiki pages are intentionally scoped and concise. An update is only justified when the source contains information ` +
    `that clearly fits within the wiki page's existing purpose and level of detail — not simply because the source is ` +
    `topically related or contains more detail on something the wiki already covers. Avoid committing updates that would ` +
    `add excessive detail, transform the character of the page, or duplicate content the wiki already addresses adequately.\n\n` +
    `Labels: ${labelList}\n\n` +
    `- committed_critical: source contains a key fact, correction, or addition that clearly belongs in this wiki page and is missing\n` +
    `- committed_moderate: source adds a concrete, focused piece of information that fits the page's scope\n` +
    `- committed_nit: source only justifies a very minor or cosmetic touch\n` +
    `- no_change_covered: wiki already covers the topic adequately — no new information in the source\n` +
    `- no_change_extra: source has additional detail but it exceeds the page's intended scope or level of detail\n` +
    `- irrelevant: the source document is not relevant to this wiki page\n\n` +
    `When in doubt between committing and no_change, prefer no_change_extra.\n\n` +
    `Respond with JSON only: {"label":"<one of the labels>","reasoning":"<1-2 sentences>"}`,
  ].join("\n\n");

  let errorMsg = null;
  try {
    const resp = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "x-api-key": anthropicKey,
        "anthropic-version": "2023-06-01",
        "anthropic-dangerous-direct-browser-access": "true",
        "content-type": "application/json",
      },
      body: JSON.stringify({
        model: "claude-opus-4-7",
        max_tokens: 256,
        system: "You are an expert technical editor evaluating whether a wiki page should be updated based on a source document. Wiki pages are scoped and concise — more detail is not always better. Reply only with the requested JSON.",
        messages: [{ role: "user", content: userMsg }],
      }),
    });
    const data = await resp.json();
    if (data.error) throw new Error(data.error.message || JSON.stringify(data.error));
    let text = data.content?.[0]?.text?.trim() || "";
    if (text.startsWith("```")) text = text.replace(/^```[^\n]*\n/, "").replace(/\n```[\s\S]*$/, "").trim();
    const parsed = JSON.parse(text);
    if (!LABELS.find(l => l.value === parsed.label))
      throw new Error(`Unknown label from judge: "${parsed.label}"`);
    const idx = samples.findIndex(s => s.id === sample.id);
    if (idx !== -1) {
      samples[idx].judge_label     = parsed.label;
      samples[idx].judge_reasoning = parsed.reasoning;
      // Propagate to samples with same source + wiki (don't overwrite existing)
      samples.forEach((s, i) => {
        if (i === idx || s.judge_label) return;
        if (s.source_content === sample.source_content && s.wiki_body_before === sample.wiki_body_before)
          Object.assign(s, { judge_label: parsed.label, judge_reasoning: parsed.reasoning });
      });
    }
    await writeBack();
  } catch (e) {
    errorMsg = e.message || String(e);
  } finally {
    judging.delete(sample.id);
    if (samples[current]?.id === sample.id) {
      if (errorMsg) {
        const box = document.getElementById("judge-box");
        box.style.display = "";
        box.innerHTML = `<strong style="color:#c00;">Judge error</strong>${esc(errorMsg)}`;
      } else {
        render();
      }
    }
  }
}

// ── Wiki before with inline diff highlights ───────────────────────────────────

function renderWikiBefore(el, wikiBody, diff) {
  el.className = "md-body";
  el.removeAttribute("style");

  if (!diff) {
    el.innerHTML = marked.parse(wikiBody);
    return;
  }

  const lines = wikiBody.split("\n");

  // Parse diff into hunks: [{removedStart, removed:[], added:[]}]
  const hunks = [];
  let cur = null, origIdx = -1;
  for (const dl of diff.split("\n")) {
    if (dl.startsWith("@@")) {
      const m = dl.match(/@@ -(\d+)/);
      if (m) { origIdx = parseInt(m[1]) - 1; cur = { removedStart: origIdx, removed: [], added: [] }; hunks.push(cur); }
    } else if (/^(---|[+]{3}|commit |Author:|Date:|diff |index )/.test(dl)) {
      // skip git header lines
    } else if (dl.startsWith("-") && cur) {
      cur.removed.push(dl.slice(1)); origIdx++;
    } else if (dl.startsWith("+") && cur) {
      cur.added.push(dl.slice(1));
    } else {
      origIdx++;
    }
  }

  // Build HTML: unchanged segments → markdown, hunk lines → highlighted blocks
  let html = "";
  let pos = 0;
  for (const h of hunks) {
    if (pos < h.removedStart) {
      html += marked.parse(lines.slice(pos, h.removedStart).join("\n"));
    }
    for (const t of h.removed) {
      html += `<div style="background:#ffebe9;font-family:monospace;font-size:12px;line-height:1.6;padding:1px 6px;">${esc(t)||"&nbsp;"}</div>`;
    }
    for (const t of h.added) {
      html += `<div style="background:#e6ffed;font-family:monospace;font-size:12px;line-height:1.6;padding:1px 6px;">${esc(t)||"&nbsp;"}</div>`;
    }
    pos = h.removedStart + h.removed.length;
  }
  if (pos < lines.length) html += marked.parse(lines.slice(pos).join("\n"));

  el.innerHTML = html;
}

// ── Content renderer (markdown if detectable, else plain text) ────────────────

function renderContent(el, text) {
  const looksLikeMarkdown = /^#{1,6}\s|\*\*.+\*\*|^\s*[-*+]\s|^\s*\d+\.\s|`[^`\n]+`|\[.+\]\(.+\)|^>\s/m.test(text);
  if (looksLikeMarkdown) {
    el.className = "md-body";
    el.innerHTML = marked.parse(text);
  } else {
    el.className = "source-text";
    el.textContent = text;
  }
}

// ── API key management ────────────────────────────────────────────────────────

function promptApiKey() {
  document.getElementById("api-modal-input").value = anthropicKey;
  document.getElementById("api-modal").style.display = "flex";
  setTimeout(() => document.getElementById("api-modal-input").focus(), 50);
}

function closeApiModal(save) {
  document.getElementById("api-modal").style.display = "none";
  if (!save) return;
  anthropicKey = document.getElementById("api-modal-input").value.trim();
  document.getElementById("api-key-btn").textContent = anthropicKey ? "⚙ Change API key" : "⚙ Set API key";
  if (samples.length) render();
}

// ── Util ──────────────────────────────────────────────────────────────────────

function esc(s) {
  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

// Keyboard shortcuts
document.addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
  if (e.key === "ArrowLeft")  navigate(-1);
  if (e.key === "ArrowRight") navigate(1);
  if (e.key === "j") judgeCurrent();
  if (e.key === "1") selectLabel("committed_critical");
  if (e.key === "2") selectLabel("committed_moderate");
  if (e.key === "3") selectLabel("committed_nit");
  if (e.key === "4") selectLabel("no_change_covered");
  if (e.key === "5") selectLabel("no_change_extra");
  if (e.key === "6") selectLabel("irrelevant");
  if (e.key === "Enter") saveLabel();
});
</script>
