  ---
  ## Summary by cubic
  Adds end-to-end support for Custom External Apps. Admins can upload a skill bundle, set URL patterns and header auth, and users connect by entering their own credentials (no OAuth).

  - **New Features**
    - Admin UI: modal to create/edit custom apps with bundle upload, URL patterns, header template, and org credentials. Added “Custom app” card to the Apps page.
    - Backend: `POST /admin/apps/custom` (multipart) to create/edit custom apps. Shared `ingest_skill_bundle` path validates SKILL.md, derives slug on create, keeps slug on bundle replacement, and cleans up blobs on failures and after swaps. JSON parsing for form fields with strict validation. JSON `POST /admin/apps` now rejects `CUSTOM`.
    - Users: “Connect” for custom apps opens a credentials modal to save required keys; no OAuth redirect.
    - Services: added `upsertCustomExternalApp`; enable/disable for custom apps uses the custom endpoint.
    - Reliability: validates header auth templates (supports allowlist-only apps); pushes updated skills to affected sandboxes.
    - Tests: coverage for custom app create/edit, bundle cleanup, and auth template validation.

  - **Migration**
    - Creating or editing custom apps must use `POST /admin/apps/custom`. The JSON `POST /admin/apps` now rejects `CUSTOM`.

  <sup>Written for commit e72d14a20b0e1794b77a27a9e050e5e373c0a367. Summary will update on new commits. <a href="<URL>>Review in cubic</a></sup>

