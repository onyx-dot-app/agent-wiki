current_body: |-
  # UX Requirements

  ## Reference materials

  - Agent Wiki README: <<URL>>
  - Seeded docs: <<URL>>
  - Recommended background post: <<URL>>

  ## Core principles

  - The wiki must use plain Markdown.
  - Git should be the backing system.
  - The file system should be the hierarchy.
  - Prefer explicit UI over hidden controls, so users do not need to hover over many buttons or guess what is happening.
  - Between polishing existing functionality and adding new functionality, prioritize making the existing experience good.

  ## Triggers

  - Use the term **Trigger** instead of **Automation**.
    - The wiki does not perform automation itself; it only provides triggers.
    - This terminology is clearer for users familiar with platforms like Zapier and n8n.
    - Those users are expected to be the primary users of triggers.

  ## Permissions, scope, and history

  - Docs cannot be sectioned for edit, scope, or permissions.
  - A line-by-line Git Blame view can be provided instead.
  - Permission grants should continue to work as they do currently: easy to understand and interpret.

  ## Chat widget

  - The chat widget should be located somewhere users are already familiar with and can recognize easily.
  - A widget is preferred because it acts as a “global helper,” which aligns with user expectations for what it does.
  - AI-aided page writing with templates should happen in the expanded chat view.
    - The chat currently auto-expands.
    - From a UX perspective, it may make sense for it to auto-collapse after the user leaves that page.
  - Tool calls in the widget should be shown simply rather than with full detail.

  ## Relationship to Onyx

  - Include as little direct integration with Onyx as possible in the basic user UX.
  - The wiki does not need an Onyx connector.
    - A possible stretch goal is keeping an audit log of pages or updates being sent to the wiki.
    - This is not necessary for the initial experience.
  - The sidebar should not be integrated into Onyx for now.
    - A long-term mock is okay.
    - For the current product, the wiki should remain completely separate.
  - Some separation of style may be best so users are not confused about which app they are in.
    - Jira and Confluence are a useful comparison: they are visually different enough that users do not confuse them.

  ## Active agents

  Active agent display should include:

  - Read/write activity
  - User name
  - Agent name
  - Time of activity

  ## Existing UX that is already working well

  These areas are already in a good state and may only need small touchups:

  - Search bar and dropdowns
  - Active agent listings on wiki pages
  - File system view for navigating the wiki

  ## Open considerations

  - It may be significant work to track users who are live on a doc.
