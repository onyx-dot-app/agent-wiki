  ---
  ## Summary by cubic
  Adds end-to-end support for Custom External Apps. Admins upload a bundle and gateway config; users connect by entering their own credentials (no OAuth).

  - **New Features**
    - API: multipart `POST /admin/apps/custom` to create/edit custom apps (bundle upload, URL patterns, header template, org creds). JSON `POST /admin/apps` now rejects `CUSTOM`.
    - Validation: `parse_json_form_field` parses JSON form fields; `validate_auth_template` enforces non-empty string keys/values and allows empty templates/credentials; name and at least one URL pattern are required.
    - Bundles: shared `ingest_skill_bundle` validates `SKILL.md`, derives slug from filename on create, keeps slug on replace, stores blobs, and uses `delete_bundle_blob` for cleanup on failure and after swaps; description falls back to the bundle’s when the form description is blank; pushes updated skills to affected sandboxes.
    - DB: `create_external_app` accepts a slug for custom apps; `update_external_app` can swap bundles and returns the old blob id for deletion; app type is immutable and validated on update.
    - UI: Admin Create/Edit modal and “Custom app” card; users connect via a credentials modal (no OAuth); enable/disable uses the correct endpoint for custom apps.
    - Services/Tests: `upsertCustomExternalApp` (multipart) added; integration manager posts to the custom endpoint for `CUSTOM`; tests cover create/edit, allowlist-only apps, missing `SKILL.md`, auth-template validation, blob cleanup, and rejecting `CUSTOM` on the JSON admin endpoint.

  - **Migration**
    - Manage custom apps via `POST /admin/apps/custom`. The JSON `POST /admin/apps` rejects `CUSTOM`.

  <sup>Written for commit 9562f6173ac73546a09d89e5b279da650db1656b. Summary will update on new commits. <a href="<URL>>Review in cubic</a></sup>

  <!-- End of auto-generated description by cubic. -->


