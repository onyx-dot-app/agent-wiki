ing to Anthropic/OpenAI/internal ML jobs. Timeline: June–July: OSS deployment to production servers; ~2 months later upgrade to Enterprise. Competitor Consideration: LibreChat, Anything LLM, Microsoft Copilot, other OSS solutions. Security Considerations: GDPR/TR compliance, on‑prem data residency, RBAC/permission inheritance, enterprise SLAs. Self‑Hosting or Cloud: On‑premise (bring your own LLM keys). Quote Provided: <AMOUNT> for initial 50 users; list price discussion at <AMOUNT>/month; potential discount to ~<AMOUNT>–<AMOUNT>/month equivalent due to seasonality; BYO LLM costs separate. Overview of Use‑Case: Department‑level assistants with role‑based access, internal knowledge base (procedures, onboarding, wiki), and learning from requests to improve KB; ability to route task types to preferred models or internal ML jobs; enterprise features (SSO/RBAC/white label) required for broader rollout. Full Transcript: <URL> Participants External: Ömer Demir <<EMAIL>>; Narcan (Data Analyst/CRM) --- Internal: Matthew Veber <<EMAIL>>
