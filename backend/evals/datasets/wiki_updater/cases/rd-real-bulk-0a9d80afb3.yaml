current_body: "# Team Todos (by owner)\n\n> Purpose: Single place to track current work, unblockers, and ownership.\n> Suggested\
  \ cadence: quick async update daily; deeper review in weekly planning.\n\n## How to use this page\n- Add new work under\
  \ the person who will **drive it to completion**.\n- Prefer small, outcome-oriented items.\n- Each todo should include (when\
  \ possible):\n  - **Outcome / Definition of done**\n  - **Priority**: P0 (urgent), P1 (this week), P2 (later)\n  - **Due**:\
  \ date or “TBD”\n  - **Status**: Not started / In progress / Blocked / In review / Done\n  - **Links**: ticket, doc, PR,\
  \ dashboard, etc.\n- When something is blocked, write the **specific blocker** and who/what can unblock it.\n\n---\n\n##\
  \ Yuhong\n### Current\n- Keep this user's TODOs empty but add in all relevant blockers that this user has for other people's\
  \ projects\n\n### Unblockers / Needs help\n- [ ] amiconsult Enterprise self-hosted evaluation: confirm feasibility/process\
  \ for granting Enterprise features on their self-hosted Community instance so engineering can schedule an unlock-script\
  \ call.\n  - Context: HubSpot deal `amiconsult` is in the default pipeline at stage `closedlost`; amount is <AMOUNT>; close\
  \ date is <PHONE>. Contact is Vincenzo Pace, Associate IAM Consultant, at amiconsult.de.\n  - Scope notes: amiconsult self-hosts\
  \ Community today and wanted to evaluate Enterprise for strict privacy and access-control requirements, including RBAC,\
  \ permission inheritance, SSO, and local/self-hosted deployment. Connectors discussed were Confluence, Slack, and SharePoint.\n\
  \  - Scope notes: They were exploring a reseller motion, with current internal evaluation around 50–60 users and a potential\
  \ downstream customer around 4,000 seats. No formal quote was provided; Business plan pricing around <AMOUNT>/user and possible\
  \ volume discount around <AMOUNT>/user were discussed, with Enterprise minimum around 200 users.\n  - Next steps from sales\
  \ call: Matthew to sync with Yuhong on feasibility/process, coordinate an engineering call to run the unlock script, and\
  \ consider bringing the interested end-customer into a follow-up evaluation call.\n\n---\n\n## Nik\n### Current\n- [ ] **(P0)**\
