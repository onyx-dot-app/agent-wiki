  # Specific incidents and resolutions

  ## 1. Feb. 17 — Initial Scania call: user/log confusion, validation failure, possible firewall issue

  **Slack conversation:** “Scania Call” in `#customer-support`. [[9]](<URL>)

  Justin reported that he did not see any `@scania.com` emails in Onyx cloud and could not find the user whose logs he wanted to pull. He suspected the user might be using `<EMAIL>` and recorded tenant ID `tenant_<PHONE>f5-4f4c-b64d-9ae3ffae5a2e`. The thread framed the situation as likely an “us issue” and emphasized that Scania seemed ready to proceed, but Onyx needed to deliver a smooth connector experience and high-quality search. A validation failure was discussed; Justin was “reasonably confident” it was a firewall issue, and a clearer error message was called out as a takeaway. [[9]](<URL>)

  **Category:** Initial setup / validation; possible firewall / customer environment; logging / supportability gap.
  **Resolution status:** No confirmed resolution in retrieved Slack content; next step was more logs and continued discussion.

  ## 2. Feb. 19 — Early SharePoint ingestion-speed concern tied to Scania

  **Slack conversation:** Playlist/Scania SharePoint ingestion-speed thread. [[10]](<URL>)

  Direct Slack links surfaced in the thread:

  - <URL>
  - <URL>
  - <URL>

  Justin asked Evan whether a fix from the previous day would help SharePoint ingestion speed, saying this would likely become more important “especially with the Scania deal.” The discussion questioned whether indexing **3TB** of SharePoint data made sense and suggested pushing back on scope, e.g. asking the customer to select specific drives/content instead of indexing everything. [[10]](<URL>)

  **Category:** Sync throughput / ingestion speed; connector scope design; customer data scale.
  **Resolution status:** No Scania-specific resolution; suggested mitigation was narrower scoping and benchmarking.

  ## 3. Mar. 3 — Security rejects broad SharePoint `read all`; asks for `site select`

