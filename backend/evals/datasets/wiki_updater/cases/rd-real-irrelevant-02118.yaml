  # Related non-`#customer-support` context

  ## Feb. 4 sales discovery / enterprise platform POC requirements

  A HubSpot/Fireflies sales call summary before technical rollout framed Scania's target as an enterprise-wide knowledge base and AI-powered search across SharePoint, Teams, Jira, Confluence, SAP, ServiceNow, and other systems, plus a RAG/MCP foundation for R&D and other agents. Scania considered Microsoft Copilot / SharePoint-native options insufficient at scale and wanted to consolidate multiple search boxes into permission-aware hybrid semantic/keyword search with APIs and embeddable intranet widgets.

  The same call captured early technical requirements that later show up in the SharePoint issue history: self-hosted POC, SSO/SCIM, granular permission and group mirroring, frequent sync, bring-your-own LLM options such as Azure OpenAI/OpenAI or Bedrock, and connector assistance including ServiceNow. Next steps were a shared Teams channel, a deeper technical/evaluation planning session, and enterprise features for the self-hosted POC. [[16]](<URL>)

  ## Apr. 20 Scania / Onyx Sync meeting

  A Fireflies transcript captured Scania showing multiple SharePoint connector attempts: broad “all SharePoint” attempts and selected-site attempts. A connector like **“SharePoint all from 1st of March”** produced both “file not found” and permission-related errors, while a connector for “only one site” successfully indexed. Justin noted Scania appeared to be on `v2.12.6`, suspected `404` errors could be due to non-existent team/site names, and asked for tracebacks rather than screenshots. [[12]](<URL>)

  The same meeting discussed severe throughput concerns and an early hypothesis that CPU-based local embeddings might be a bottleneck. Justin suggested OpenAI or another API-based embedding provider could dramatically improve indexing speed. Jim said he had tried switching to OpenAI embeddings but the platform did not allow it reliably. [[12]](<URL>)

  ## Apr. 28 engineering performance analysis

  In `eng-infra`, Scania reported about **14 docs/minute** on `v3.2.1`, despite multiple docfetching replicas. Only one docfetching pod was materially busy, and logs showed repeated SharePoint permission/external-access work such as “Getting external access for ...” and `permission_utils.py ... Processing group ...`. [[13]](<URL>)

  Engineering explained that SharePoint data retrieval is serialized per connector: `connector_doc_fetching_task` is expected to run as one long-lived task on a single worker. Chunking, embedding, and indexing can parallelize later, but the SharePoint fetch/permission stage for a single connector does not fan out across all docfetching replicas. Recommended workaround: split SharePoint into multiple connectors by site/drive/scope. [[13]](<URL>)

  ## Apr. 30 Scania / Onyx Questions Sync meeting

  A Fireflies transcript captured Scania discussing extreme SharePoint scale — potentially **150 million documents**. Evan said typical connector throughput was around 60 docs/minute, and he had seen around 200–220 docs/minute in favorable cases, but Scania’s hoped-for 1,000 docs/minute had not been tested at that scale. [[14]](<URL>)

  The meeting clarified that organization-public connectors are faster because Onyx does not need to fetch permissions. Scania had one organization-public connector running around 112 docs/minute, supporting the hypothesis that permission fetching / SharePoint API calls were the main slowdown for permission-synced connectors. Evan also discussed potential SharePoint API optimizations, including replacing some REST calls with Graph calls and sending API-identifying headers. Explicit throttling errors were not shown; SharePoint rate limiting remains a hypothesis, not a proven root cause. [[14]](<URL>)

  ## May 13 Scania / Onyx Update meeting

  A Fireflies transcript adds nuance to the May 13 support thread. Jim said Scania had reached about **200 files/minute** after settings changes, but later the connector crashed a couple of times and dropped back to about **19 docs/minute**. Evan wanted Scania on a version with indexing metrics so Onyx could see time spent in connector fetch, queue wait, doc processing, embedding, etc. Justin noted the metrics PR had likely not been cherry-picked, and Onyx might need to create a build for Scania. [[15]](<URL>)

