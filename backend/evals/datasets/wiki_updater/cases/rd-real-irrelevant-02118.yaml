  # Overview and useful context

  As of the latest retrieved `#customer-support` evidence, Scania was on **Onyx `v3.3.0`**, had **one active SharePoint connector**, and was still experiencing **indexing throughput / connector reliability issues**. Justin noted that this active connector “keeps hitting issues,” that Scania likely runs on Kubernetes, and that Onyx needed to provide an upgrade strategy. A suspected deployment anomaly was also noted: the **OpenSearch migration page was missing**, raising concern that Scania might be on `v3.3.0` without an OpenSearch container. Evan was assigned to continue looking through logs and SharePoint issue details. [[5]](<URL>)

  The prior May 11 update showed meaningful progress: Scania devtest had been upgraded to `v3.3.0`; Vespa memory had been increased from `32Gi` to `48Gi`; old Vespa `507 Insufficient Storage` / feed-blocking had stopped being the active blocker; docfetching workers were stable after a probe-timeout change; and a local SharePoint hotfix changed unauthorized `.aspx` page handling from “abort the whole connector run” to “record as per-document failure.” However, the connector named **`SharePoint all ASPX sites since first of March`** was still failing on Microsoft Graph `404 itemNotFound` for `/teams/Almedalentrip`, interpreted as a missing or invalid SharePoint site in the crawl scope. [[2]](<URL>)

  Subsequent SharePoint connector work in PR #11266 adds another relevant failure-handling improvement: Graph `HTTP 423 notAllowed` for admin-locked or M365-archived sites is now treated as a per-site failure, so tenant indexing continues to the next site. This is not evidence that Scania hit a 423, but it is relevant to Scania's broad tenant crawl risk because `getAllSites` can surface sites the app cannot read.

  PR #11324 further broadens SharePoint connector partial-failure handling. Drive traversal now catches mid-iteration Graph/runtime failures as entity failures, clears the affected drive checkpoint state, and continues; per-item processing yields document failures on unexpected item errors; site-page retrieval and per-page processing yield connector failures instead of aborting the run; and slim sync logs and skips broken sites.

  Separate docfetching observability work in PR #11294, cherry-picked to `release/v4.0` by PR #11296, fixes `document_count` so it increments for each queued batch. Builds with this fix should have docfetching logs and metrics that reflect the real number of documents processed.

  Persistent indexing work in PR #11301 adds `PERSISTENT_INDEXING=true`, which disables normal failure-volume abort thresholds and keeps per-batch docprocessing recovery for application-level failures. It does not swallow unhandled connector-generator exceptions during docfetching; those still fail the index attempt. Infra, heartbeat, and usage-limit failures also still fail the attempt. Deployment and enabling for Scania should be confirmed before relying on it as a mitigation. [[17]](<URL>), [[18]](<URL>)

  There is an apparent but explainable tension between the May 11 and May 13 updates: on May 11, Lindsey relayed that Jim said they seemed to be “up and running” at **180–200 docs/minute**, while the same May 11 update still listed the `Almedalentrip` Graph `404` as the active run-level blocker for a specific connector. [[2]](<URL>) By May 13, Justin again said Scania still had throughput issues and only one active SharePoint connector that kept hitting issues. [[5]](<URL>) This likely means Scania saw partial throughput improvement but had not reached a stable, fully resolved state.

