  # Recurring patterns and likely root causes

  ## 1. Permission-aware SharePoint indexing is the central systemic issue

  Scania requires permission-preserving SharePoint indexing across a very large and messy SharePoint estate. This forces Onyx to fetch SharePoint permissions, role assignments, external access, and group membership information. These operations repeatedly appear in stack traces and performance logs. [[1]](<URL>), [[3]](<URL>), [[13]](<URL>), [[14]](<URL>)

  Evidence includes `AIatScania` and `SJPIndependentDealers` `401`s while fetching role assignments, R&D hub group/member traversal failures, logs dominated by permission work, and faster organization-public connector performance because it skipped permission fetching.

  ## 2. Unauthorized `.aspx` pages used to abort connector runs

  A single unauthorized `.aspx` page could fail the entire connector run. This showed up in `AIatScania` and `SJPIndependentDealers` incidents. The May 11 hotfix changed behavior so page-level permission failures become per-document failures instead of run-level aborts. PR #11324 broadens this behavior so site-page retrieval failures become entity failures, individual bad pages become document failures, and pages without IDs fall back to entity failures. [[1]](<URL>), [[3]](<URL>), [[2]](<URL>), [[19]](<URL>)

  ## 3. Invalid, missing, locked, or inaccessible sites in broad crawl scope can cause Graph site-level failures

  Broad crawl scope included paths Graph could not resolve, e.g. `/teams/Plymothepsvnner` and `/teams/Almedalentrip`. These appear to be deleted, renamed, inaccessible, misspelled, or otherwise invalid sites. [[1]](<URL>), [[2]](<URL>)

  A later SharePoint connector fix, PR #11266, specifically handles Graph `HTTP 423 notAllowed` for admin-locked or M365-archived sites as per-site failures instead of tenant-run aborts. The same PR notes that `getAllSites` can surface sites the app cannot read; in builds with this fix, those 423 sites should be recorded and skipped rather than blocking the rest of the tenant crawl.

  ## 4. Throughput bottleneck is mostly SharePoint fetch/permissions, not general compute

  Earlier suspicion included CPU embeddings and AWS sizing, but later evidence points strongly to SharePoint retrieval and permission sync. On Apr. 28, only one docfetching pod was busy despite multiple replicas, and engineering explained that one connector’s SharePoint fetch stage runs as a single long-lived task. [[13]](<URL>)

  ## 5. SharePoint API rate limiting is suspected but not proven

  There is circumstantial evidence that SharePoint API latency/rate-limit pressure matters, especially given permission-heavy REST/Graph calls, but retrieved records do not show explicit `429 Too Many Requests` errors. Treat as a high-priority hypothesis requiring metrics, not as a proven root cause. [[13]](<URL>), [[14]](<URL>)

  ## 6. Deployment/version gaps delayed fixes

  Scania moved from `v2.12.6` to `v3.2.1` to `v3.3.0`, while fixes and diagnostics were being identified. Old versions lacked embedding swap, permission sync was not running in `v3.2.1`, local hotfixes were applied in `v3.3.0`, and missing OpenSearch/migration state may block moving to versions with better metrics. [[1]](<URL>), [[3]](<URL>), [[2]](<URL>), [[5]](<URL>)

  ## 7. Scania’s security model and data scale make this a difficult customer environment

  Scania’s security model rejects broad `read all`, asks for `site select`, and raises concerns about OneDrive, DLP, sensitivity labels, encrypted files, permission-change lag, and data egress. Scania’s SharePoint estate may be extremely large and decentralized, with related meeting context discussing up to 150 million documents. [[6]](<URL>), [[7]](<URL>), [[14]](<URL>)

