  ## 9. Apr. 30 — `v3.2.1`: chunked response failure, `.aspx` `401`, R&D hub traversal, permission sync not running

  **Slack conversation:** “Scania Sharepoint Issues”. [[3]](<URL>)

  Justin posted Scania was on **`v3.2.1`**, “a bit behind,” and that Onyx needed to give them a tag containing all fixes. [[3]](<URL>)

  ### Issue 1: `ChunkedEncodingError: Response ended prematurely`

  The trace failed during SharePoint drive-item conversion with permissions. The final error was:

  ```text
  requests.exceptions.ChunkedEncodingError: Response ended prematurely
  ```

  This appears to have happened while reading a SharePoint response stream during permission-aware drive item processing. [[3]](<URL>)

