  against:

  ```text
  <URL>)
  ```

  This was another failure while fetching SharePoint role assignments / permissions for a site page. [[3]](<URL>)

  ### Issue 3: R&D hub group/member traversal failure

  The R&D hub trace passed through SharePoint site-page conversion and external permission fetching, then into `_get_groups_and_members_recursively` and `_get_azuread_groups`. The retrieved content truncated before the final exception, but it clearly involved failure while resolving SharePoint/Azure AD group membership for permissions. [[3]](<URL>)

  ### Permission sync not running

  Justin added that Scania’s **permission sync was also not running** and said, “I think we should move this fix to their version.” He linked GitHub commit:

  ```text
  <URL>
  ```

  [[3]](<URL>)

  **Category:** Permission/external access failures; connector runtime failure; group/member resolution; permission sync scheduling/version issue.
  **Resolution status:** No customer-confirmed resolution in this thread. May 11 later confirms `.aspx` page-failure behavior was mitigated with a local hotfix. [[2]](<URL>)

  ## 10. May 11 — `v3.3.0`: Vespa `507` resolved, `.aspx` behavior hotfixed, active blocker is Graph `404`

  **Slack conversation:** “Scania Update - New thread”. [[2]](<URL>)

  Scania devtest had been upgraded to **`v3.3.0`**.

  ### Vespa `507 Insufficient Storage` / feed blocking

  Scania had been hitting Vespa feed blocking and:

  ```text
  507 Insufficient Storage
  ```

  They increased Vespa memory:

  ```text
  32Gi -> 48Gi
  ```

  After that, the old Vespa `507` issue stopped being the active blocker. [[2]](<URL>)

  ### `.aspx` page-level permission failure hotfix

  A local hotfix changed behavior so a single unauthorized `.aspx` page is recorded as a **per-document failure** instead of aborting the entire indexing attempt. This resolved the earlier `401` failure pattern for the `SJPIndependentDealers` site page path. [[2]](<URL>)

  ### Worker/probe timeout stabilized

  Docfetching workers were stable after a probe-timeout change. [[2]](<URL>)

  ### Current blocker: Graph `404 itemNotFound` for `/teams/Almedalentrip`

  The connector:

  ```text
  SharePoint all ASPX sites since first of March
  ```

  was still failing with:

  ```text
  Microsoft Graph 404 itemNotFound
  Requested site could not be found
  ```

  for:

  ```text
  <URL>
  ```

  The update says the active run-level blocker appeared to be a **missing or invalid SharePoint site in the crawl scope**, not the old site-page `401` or Vespa capacity issue. Jim also reported throughput of **180–200 docs/minute**. [[2]](<URL>)

  **Resolution status:** Partially resolved / partially open.

  Resolved or mitigated:

  - Vespa `507` after memory increase.
  - `.aspx` page-level `401` abort behavior via local hotfix.
  - `SJPIndependentDealers` `401` pattern.
  - Docfetching worker instability.

  Still open:

  - Graph `404` on `/teams/Almedalentrip`.
  - Historical unresolved item errors from earlier failed runs.
  - No full customer-confirmed final resolution.

  ## 11. May 13 — Upgrade path: still throughput issues, one active connector, missing OpenSearch concern

  **Slack conversation:** “Scania Upgrade path”. [[5]](<URL>)

  Justin posted Scania was on **`v3.3.0`** and still having indexing throughput issues. Confirmed state:

  - Scania had only **one active SharePoint connector** running.
  - That connector **kept hitting issues**.
  - The OpenSearch migration page was missing, suggesting there might not be an OpenSearch container running.
  - Scania likely used Kubernetes, so Onyx needed to send upgrade strategy information.
  - `v4.0.X` was discussed because Evan’s metrics work should be part of that release.
  - Evan was assigned to continue reviewing logs and information to figure out the SharePoint issues.

  [[5]](<URL>)

  **Category:** Ongoing throughput / connector reliability; deployment/version state; missing OpenSearch; observability gap; upgrade strategy.
  **Resolution status:** Open as of latest retrieved `#customer-support` evidence.

