  # Resolved or mitigated items

  - **Vespa `507 Insufficient Storage` / feed blocking** — resolved as active blocker by increasing Vespa memory from `32Gi` to `48Gi`. [[2]](<URL>)
  - **Unauthorized `.aspx` page aborting whole connector run** — mitigated in Scania devtest by local hotfix; page-level permission failures become per-document failures. [[2]](<URL>)
  - **Graph `HTTP 423 notAllowed` for admin-locked or M365-archived sites** — mitigated upstream by PR #11266; 423 now joins `403/404/410` as a per-site Graph failure status so tenant indexing continues to the next site. Deployment to Scania should still be confirmed before treating this as resolved in their environment.
  - **SharePoint drive-iteration and site-page runtime failures** — mitigated upstream by PR #11324; common drive traversal, per-item, site-page retrieval, and per-page errors now surface as entity or document failures so indexing can continue. Deployment to Scania should still be confirmed before treating this as resolved in their environment.
  - **`SJPIndependentDealers` earlier `401` failure pattern** — May 11 update says the `.aspx` hotfix resolved it. [[2]](<URL>)
  - **Docfetching worker timeout / probe instability** — May 11 update says docfetching workers were stable after a probe-timeout change. [[2]](<URL>)
  - **Very low throughput improved at least temporarily** — throughput improved from 4–6 docs/min and ~14 docs/min to 180–200 docs/min, but later regressed/unstabilized per May 13 evidence. [[4]](<URL>), [[13]](<URL>), [[2]](<URL>), [[15]](<URL>)

  ---

  # Open issues / unresolved questions

  1. **Active Graph `404` for `/teams/Almedalentrip`** — validate whether the site exists, was renamed/deleted, requires different permissions, or should be removed from crawl scope. [[2]](<URL>)
  2. **Ongoing throughput instability** — deploy indexing phase metrics to isolate SharePoint fetch, permission lookup, queueing, doc processing, embedding, and Vespa/indexing time. [[5]](<URL>), [[15]](<URL>)
  3. **Missing OpenSearch migration page / possible missing OpenSearch container** — confirm deployment topology and provide Kubernetes upgrade guidance. [[5]](<URL>)
  4. **Permission sync / group sync visibility and scheduler behavior** — verify scheduler jobs are running and confirm commit `667db2e8f573f015d9030e634c0bd1d8bbc0685b` or equivalent is deployed. [[3]](<URL>), [[14]](<URL>)
  5. **R&D hub final root cause** — Apr. 22 screenshot/error details are missing; Apr. 30 trace is truncated before final exception. [[11]](<URL>), [[3]](<URL>)
  6. **`403 forbidden` on opening private doc** — confirm whether user error, SharePoint propagation delay, missing permission, or expected behavior. [[8]](<URL>)
  7. **Security/governance answers incomplete** — final approved answers around `site select`, DLP, labels, encrypted files, OneDrive, OpenAI embeddings, and permission-change lag were not present in retrieved Slack results. [[6]](<URL>), [[7]](<URL>)

  ---

  # Recommendations / action items

  ## Technical actions

  1. **Validate and clean crawl scope**
     - Remove/quarantine invalid or missing sites such as `/teams/Almedalentrip` and `/teams/Plymothepsvnner` unless Scania confirms they exist and are accessible. [[1]](<URL>), [[2]](<URL>)
     - Add preflight validation for broad SharePoint site lists so invalid sites do not become run-level blockers.
     - Include PR #11266 or equivalent behavior in the target release/tag so admin-locked or archived sites are recorded and skipped instead of blocking tenant crawls.
     - Include PR #11324 or equivalent behavior in the target release/tag so drive-iteration, per-item, and site-page runtime errors are recorded as connector failures where possible instead of aborting the run.
     - If Scania uses a build with PR #11301 and PR #11311 behavior, consider enabling `PERSISTENT_INDEXING=true` so failure-volume abort thresholds are bypassed and docprocessing batch errors continue to recover. Unhandled connector-generator exceptions during docfetching still fail the attempt, as do infra, heartbeat, and usage-limit failures.

  2. **Keep per-document failure behavior for inaccessible `.aspx` pages**
     - Ensure the local hotfix that converts unauthorized page-level permission failures into per-document failures is included in Scania’s durable release/tag. [[2]](<URL>)

  3. **Verify permission sync and group sync**
     - Confirm scheduler tasks are present and running.
     - Confirm group-to-email mapping jobs run successfully.
     - Confirm commit `667db2e8f573f015d9030e634c0bd1d8bbc0685b` or equivalent is present in Scania’s deployed version. [[3]](<URL>)
     - Improve UI/logging so Scania can distinguish initial indexing, permission sync, and group sync states. [[14]](<URL>)

  4. **Deploy observability / timing metrics**
     - Add per-phase indexing metrics: connector fetch, SharePoint permission fetch, queue wait, doc processing, embedding, Vespa/indexing.
     - Use `release/v4.0` or another target release that includes PR #11294/PR #11296 so docfetching `document_count` reflects the real number of documents processed in queued batches.
     - Without this, Onyx cannot prove whether the bottleneck is SharePoint API latency/rate limits, permission traversal, embeddings, Vespa, or worker scheduling. [[5]](<URL>), [[15]](<URL>)

  5. **Split large SharePoint scope into multiple connectors**
     - A single SharePoint connector’s fetch stage is serialized through one long-lived docfetching task. Multiple docfetching replicas do not parallelize a single connector. [[13]](<URL>)
     - Split Scania’s SharePoint estate by site, drive, business area, or time window to utilize multiple workers. [[13]](<URL>)

  6. **Treat SharePoint API rate limits as a hypothesis to test**
     - Add timing/response telemetry.
     - Consider moving eligible REST calls to Graph.
     - Add Microsoft-recommended API headers if not already present.
     - Do not present throttling as proven unless logs show explicit rate-limit evidence. [[13]](<URL>), [[14]](<URL>)

  7. **Confirm OpenSearch / upgrade path**
     - Determine whether Scania’s `v3.3.0` deployment should have OpenSearch and why the migration page is missing. [[5]](<URL>)
     - Provide Kubernetes-specific upgrade instructions and a target version/tag.
     - Decide whether Scania should move to `v4.0.X` for metrics once OpenSearch/migration blockers are cleared.

  ## Customer-facing actions

  1. **Set expectations on full-estate indexing** — Scania’s SharePoint estate is large and decentralized; broad sweeps will hit invalid sites, permission edge cases, and latency/rate-limit bottlenecks.
  2. **Explain permission-preserving tradeoffs** — organization-public connectors are faster because they skip document-level permission fetching; permission-synced connectors are safer but slower. [[14]](<URL>)
  3. **Document security answers** — provide clear responses on `read all` vs `site select`, OneDrive, OpenAI embeddings, DLP, sensitivity labels/encryption, permission-change lag, and audit logging. [[6]](<URL>), [[7]](<URL>), [[4]](<URL>)
  4. **Explain partial failure semantics** — after the `.aspx` hotfix, inaccessible pages should become per-document failures, not full-run failures. [[2]](<URL>)

