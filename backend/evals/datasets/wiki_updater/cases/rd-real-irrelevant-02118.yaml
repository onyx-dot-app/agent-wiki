  Lindsey reported Scania IT Security declined to allow the connector to have **`read all` access** and wanted **`site select`** instead. Scania also asked whether OpenAI embedding models would cause Scania information to leave Scania’s control and go to OpenAI servers. A broader governance concern was that because anyone at Scania can create a SharePoint site, Onyx could make information in that “swamp” easy to find, including sensitive information accidentally posted with public access. [[6]](<URL>)

  **Category:** Security / governance; SharePoint permission model; connector configuration; customer environment constraints.
  **Resolution status:** No final answer or resolution appears in retrieved Slack content.

  ## 4. Mar. 11 — Security asks about OneDrive, DLP, sensitivity labels, and permission-change lag

  **Slack conversation:** “Latest Scania Security Questions to be answered”. [[7]](<URL>)

  Lindsey posted additional Scania Security questions:

  - Whether Onyx would search only SharePoint or also index OneDrive content.
  - How Onyx interacts with Microsoft Data Loss Prevention rules.
  - How Onyx handles SharePoint sensitivity labels, including confidential/secret labels and encrypted files.
  - How quickly permission changes are reflected in the index.

  **Category:** Security / governance; permissions sync latency; DLP / labels / encryption.
  **Resolution status:** No confirmed answers appear in retrieved Slack content; Lindsey’s notes are draft/confirmation questions, not final commitments.

