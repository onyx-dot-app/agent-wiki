  # MCP server

  The wiki exposes itself as a Model Context Protocol server so external coding agents can read, search, edit, and subscribe to wiki docs as a first-class workspace.

  ## Surface

  Single endpoint at `/api/mcp`, both methods bearer-authed:

  - `POST /api/mcp` — JSON-RPC 2.0 request/response.
  - `GET /api/mcp` — long-lived SSE stream for server-initiated frames.
