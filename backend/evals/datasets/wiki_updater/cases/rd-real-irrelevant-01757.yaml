  ## Evan
  ### Current
  - [ ] **(P0)** perm sync fixes — *Status:* implementing fixes — *Due:* May 11
    - Outcome: All perm sync related issues that occur at reasonably high frequency (>10 in the last week) are resolved (fixed in code or determined to be user error)
    - Scope update: PR #11284 fixes Confluence Server/DC space pagination by following `_links.next` instead of stopping when the result count is below the requested limit, preventing missed spaces and downstream permission-sync failures. PR #11291 fixes Confluence Server/DC pagination during permission sync and CQL retrieval when `_paginate_url` runs without a callback, so capped or misreported pages do not miss results. PR #11299 cherry-picks the #11291 fix to `release/v4.0`.
    - Links: <URL> PR #11284: <URL> PR #11291: <URL> PR #11299: <URL>
    - Blockers: None
  - [ ] **(P1)** BYOK LLM Key — *Status:* planning phase — *Due:* May 12
    - Outcome: Admins can configure LLM providers to be "BYOK" i.e. users have to provide their own key. BYOK should let customers bypass Onyx-managed weekly limits, including the shared per-tenant LLM cost cap, API call caps, non-streaming API call caps, and chunks-indexed caps; customers then pay OpenAI/Anthropic directly and are subject to their provider/account limits instead. Customers using Onyx's own API keys are intentionally covered by their plan and remain subject to weekly usage limits.
    - Scope notes: Onyx Cloud defaults to Onyx-managed OpenAI and Anthropic API keys as a convenience. Customer-facing guidance says users add their own OpenAI or Anthropic API key via Admin Panel → Configuration → LLM.
    - Links: <URL> <URL> <URL> <URL> Discord thread: OnyxBot <> anjeriko
