  \ export.  \n  - Links: <URL>  \n  - Blockers: None listed\n\n---\n\n## Evan\n### Current\n- [ ] **(P0)** perm sync fixes\
  \ — *Status:* implementing fixes — *Due:* May 11 \n  - Outcome: All perm sync related issues that occur at reasonably high\
  \ frequency (>10 in the last week) are resolved (fixed in code or determined to be user error)\n  - Scope update: PR #11284\
  \ fixes Confluence Server/DC space pagination by following `_links.next` instead of stopping when the result count is below\
  \ the requested limit, preventing missed spaces and downstream permission-sync failures. PR #11291 fixes Confluence Server/DC\
  \ pagination during permission sync and CQL retrieval when `_paginate_url` runs without a callback, so capped or misreported\
  \ pages do not miss results. PR #11299 cherry-picks the #11291 fix to `release/v4.0`.\n  - Links: <URL> PR #11284: <URL>\
  \ PR #11291: <URL> PR #11299: <URL>  \n  - Blockers: None\n- [ ] **(P1)** BYOK LLM Key — *Status:* planning phase — *Due:*\
  \ May 12 \n  - Outcome: Admins can configure LLM providers to be \"BYOK\" i.e. users have to provide their own key. BYOK\
