  \ API call caps, and chunks-indexed caps; customers then pay OpenAI/Anthropic directly and are subject to their provider/account\
  \ limits instead. Customers using Onyx's own API keys are intentionally covered by their plan and remain subject to weekly\
  \ usage limits.\n  - Scope notes: Onyx Cloud defaults to Onyx-managed OpenAI and Anthropic API keys as a convenience. Customer-facing\
