  ## Summary by cubic
  Adds a Jira Service Management connector that reuses the Jira connector and emits documents under `jira_service_management` so service desk tickets can be indexed and shown separately. Clarifies UI scoping to avoid duplicates when Jira is also connected; aligns with Linear 2281.

  - New Features
    - Backend: new `DocumentSource` `jira_service_management`, `JiraServiceManagementConnector` subclass, and registry entry.
    - Frontend: source metadata and connector form (base URL; scope: everything/project/JQL; comment email blacklist; scoping guidance); autosync enabled; credential template.
    - Tests: unit and mocked daily tests to validate source emission and registry mapping.

  - Refactors
    - `JiraConnector` exposes a `source` attribute (default `jira`) and forwards it to issue processing.
    - `process_jira_issue` now accepts a `source` param; defaults preserve existing Jira behavior.

