wiki_path: services/billing/architecture.md
current_body: |
  # Billing architecture

  ## Components

  - `billing-api` — FastAPI app, owns invoice creation and Stripe webhook handling.
  - `billing-worker` — pgmq consumer, processes invoice events.
  - `billing-db` — Postgres 17 with the `pgmq` extension.

  ## Constraints

  - Idempotency keys on every invoice mutation.
  - Webhook handler returns 200 within 5s or Stripe retries.
