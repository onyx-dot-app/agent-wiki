  # Auth outage runbook

  ## Symptom

  Users see 500s on /login. PagerDuty fires `auth-5xx-spike`.

  ## First response

  1. Page the auth on-call.
  2. Check the `auth-api` dashboard for elevated 5xx.
  3. If error rate is over 5%, fail over to `auth-api-standby`.
