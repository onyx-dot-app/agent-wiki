doc_content: 'Adds a **Scope check** step between the relevance check and editing rules. The core issue: the reconciler was
  adding information from source documents that was technically related but didn''t match the wiki page''s intended level
  of detail or purpose — updating a high-level page with implementation details, or filling a concise page with everything
  from a long PR description. The new section makes explicit that the page — not the source document — defines what belongs.'
