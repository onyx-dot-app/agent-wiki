current_body: |
  # Bloat Handling

  ## Current implementation
  - BM25 candidates with a cutoff.
  - Per candidate page: NO_CHANGE / IRRELEVANT / new body classifications via the typed `submit_results` tool call.
  - The reconciler prompt treats bare CRM/contact records as non-actionable for todo pages and forbids creating action/checklist entries unless the source explicitly describes work to be done.
  - Edit application still uses targeted FIND/REPLACE blocks.
