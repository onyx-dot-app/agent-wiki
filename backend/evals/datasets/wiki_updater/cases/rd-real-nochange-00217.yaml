doc_content: "## Description\r\nThis PR introduces endpoints for external app management. The routes are the following:\r\n\
  \ - POST `/admin/apps` an endpoint for configuring external apps for the entire org\r\n - GET `/admin/apps` an endpoint\
  \ for viewing external apps for the entire org\r\n - DELETE `/admin/apps/{external_app_id}` an endpoint for deleting apps\
  \ from the entire org\r\n - POST `/apps/{external_app_id}/credentials` an endpoint for configuring individual user credentials\
  \ for an external app\r\n - GET `/apps` an endpoint for viewing all apps exposed to the individual user + how the user setup\
  \ the app\r\n\r\n\r\n## How Has This Been Tested?\r\nIntegration tests\r\n\r\n## Additional Options\r\n\r\n- [ ] [Optional]\
  \ Please cherry-pick this PR to the latest release version.\r\n- [x] [Optional] Override Linear Check\r\n\r\n\r\n\n<!--\
  \ This is an auto-generated description by cubic. -->\n---\n## Summary by cubic\nAdds an External Apps API under `/build`\
  \ for org-managed integrations and per-user credentials, behind the craft flag. External-app-backed skills are hidden from\
  \ skills endpoints and only injected into sandboxes when the user is authenticated; `enabled` is a kill switch.\n\n- **New\
  \ Features**\n  - Admin: POST `/build/admin/apps` (create or update with `id`, 404 if missing), GET `/build/admin/apps`,\
  \ DELETE `/build/admin/apps/{id}` (404 if missing); fields: `app_type`, `upstream_url_patterns`, `auth_template`, `organization_credentials`,\
  \ `enabled`. Permission-gated.\n  - User: GET `/build/apps` returns `id`, `name`, `description`, `app_type`, `credential_keys`,\
  \ `credential_values`, `authenticated`; POST `/build/apps/{id}/credentials` upserts creds (404 if app not found). Disabled\
  \ apps are hidden. Org creds and the raw `auth_template` are never exposed. Users are immediately authenticated when org\
  \ covers all template keys.\n  - Skills integration: Skills endpoints never return external-app-backed skills; sandbox injection\
  \ includes only authenticated ones. Delete cascades to user credentials.\n  - Data: Atomic per-user credential upsert; filters\
  \ stale keys after template/org-credential changes; strict per-user isolation.\n\n- **Migration**\n  - Set `ENABLE_CRAFT=true`.\n\
  \  - Seed apps via POST `/build/admin/apps` with `name`, `description`, `app_type`, `upstream_url_patterns`, `auth_template`,\
  \ `organization_credentials`, `enabled`.\n  - Users add credentials via POST `/build/apps/{id}/credentials`.\n\n<sup>Written\
  \ for commit a<PHONE>b055c802b734cebcb0f5cdd6232b0a. Summary will update on new commits. <a href=\"<URL> in cubic</a></sup>\n\
  \n<!-- End of auto-generated description by cubic. -->\n\n\r\n\r\n"
