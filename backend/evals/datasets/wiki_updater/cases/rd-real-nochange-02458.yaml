urity Considerations:Self-hosted in customer’s Azure; SSO required; strong data governance and access control via SharePoint ACLs.Self-Hosting or Cloud:Self-hosted (Azure).Quote Provided:No formal quote; indicative pricing discussed: <AMOUNT>/month for Enterprise with volume discounts at higher tiers; trial enterprise flag possible for self-hosted.Overview of Use-Case:Internal knowledge assistant (“chat with your data”) with SharePoint sources, authenticated via Entra ID; pilot to assess adoption and inform broader deployment and architecture (scale to Kubernetes if >50 users).Full Transcript: View Fireflies Recording
