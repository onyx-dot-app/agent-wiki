doc_content: |
  ### Summary
  This PR adds a new **Freshdesk Solutions (Knowledge Base)** connector to Onyx, enabling teams to index and search Freshdesk “Solutions” articles (categories → folders → articles), including optional embedded image extraction.

  Freshdesk’s Knowledge Base is often the single source of truth for **customer-facing and internal support content** (article management, approval workflows, multilingual KB, analytics, and self-service) - making it a high-impact source for enterprise search and RAG. See Freshdesk’s KB overview for context: [Knowledge Base Management: Freshdesk Support](<URL>).

  ---

  ### Why this matters
  - **Unlocks self-serve knowledge in Onyx**: Freshdesk Solutions articles commonly contain “how-to”, troubleshooting, and policy content that users search for repeatedly.
  - **Reduces repetitive support load**: Indexing KB content improves findability for agents and end-users, helping deflect tickets and speed up resolutions.
  - **Better retrieval quality**: KB articles are structured, curated, and frequently updated - ideal for high-signal embeddings and reliable citations.

  ---

  ### What’s included
  - **Backend**
    - New `DocumentSource`: `freshdesk_solutions`
    - New connector: `FreshdeskSolutionsConnector` (`LoadConnector` + `PollConnector`)
    - Connector registration in the backend registry
    - Image handling for inline Freshdesk attachments (when image extraction is enabled)

  - **Frontend**
    - New selectable source `freshdesk_solutions` in the UI
    - Credential schema + template + labels
    - Connector config entry
    - **Custom icon** wired for this source (`web/public/FreshdeskSolutions.png`)

  - **Tests**
    - Added deterministic unit tests for credential normalization, doc creation, and retry behavior
    - Added a daily connector test scaffold (marked `xfail` until CI secrets + sandbox are set up)

  ---

  ### Configuration / credentials
  - **Required credential fields (UI)**
    - `freshdesk_solution_domain` (e.g. `acme` or `acme.freshdesk.com`)
    - `freshdesk_solution_api_key`
    - `freshdesk_solution_password`

  - **Optional environment tuning**
    - Connector runtime knobs (retry intervals, rate-limit waits, image thresholds, attachment URL patterns, etc.) follow the repo pattern and live in `backend/onyx/configs/app_configs.py`.

  ---

  ### Test plan
  - **Unit tests**
    - `pytest backend/tests/unit/onyx/connectors/freshdesk_solutions/test_freshdesk_solutions_connector.py`

  - **Mapping validation**
    - `pytest backend/tests/unit/onyx/connectors/test_connector_factory.py -k "all_document_sources_mapped or all_connector_mappings_exist"`

  - **Manual (recommended)**
    - Create a `Freshdesk Solutions` connector via Admin UI
    - Run indexing and confirm:
      - articles appear with correct title + category/folder context
      - links open the Freshdesk article
      - embedded images are ingested when enabled

  ---

  ### Notes for reviewers
  - **Non-breaking**: adds a new source + connector without altering existing sources.
  - **Follows Onyx connector conventions**: registry wiring, source metadata, and env config placement align with existing connectors.

