  ## Description

  - Refreshes the scheduled task run history table every 5 seconds so ongoing run statuses update without a page reload.

  ## How Has This Been Tested?

  - npm run types:check
  - Commit hook: oxfmt, oxlint, TypeScript type check

  ## Additional Options

  - [ ] [Optional] Please cherry-pick this PR to the latest release version.
  - [x] [Optional] Override Linear Check

