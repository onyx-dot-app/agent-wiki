doc_title: '11355: fix(ingestion-api): stop overriding source = FILE on documents'
doc_url: <URL>
doc_content: |-
  The TODO right above this block says "remove once the frontend is updated":

  ```python
  # TODO once the frontend is updated with this enum, remove this logic
  if document.source == DocumentSource.INGESTION_API:
      document.source = DocumentSource.FILE
  ```

  The frontend already sends `source_type = ["ingestion_api"]` in its search filters. So with the override in place, docs end up stored as "file" in Vespa, the filter looks for "ingestion_api", and nothing matches — the assistant keeps saying it can't find anything.

  Removed the three lines + the now-unused `DocumentSource` import. Spotted on our deploy (~900 docs via Ingestion API).

  <!-- This is an auto-generated description by cubic. -->
  ---
  ## Summary by cubic
  Removed the logic that changed Ingestion API docs’ source to `FILE`. Docs now keep `INGESTION_API`, so searches with `source_type=["ingestion_api"]` return results again.

  <sup>Written for commit 09419440e81276cdb8850edbf374baff4a820a5e. Summary will update on new commits. <a href="<URL>>Review in cubic</a></sup>

  <!-- End of auto-generated description by cubic. -->

  ## For existing deployments

  Documents already ingested before this fix stay in Vespa with `source = "file"` and remain invisible to the chat UI's `source_type = ["ingestion_api"]` filter. They need to be re-pushed through the Ingestion API once — any subsequent upsert replaces the Vespa entry with the correct source. No schema migration or full re-index needed.
