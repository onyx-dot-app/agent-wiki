  Pipeline: default Note: Sales Call Summary Meeting Date: <PHONE>:00 UTC Attendees: Matthew Veber (<EMAIL>); Chris Weaver (<EMAIL>); James Warner (<EMAIL>) Pricing Discussion No specific pricing discussed. University-special pricing and hybrid engagement models considered; Microsoft Copilot is free for Hult; current Langdoc licensing and cost controls are a constraint. No quote provided in this call. Key Points Hult is exploring a university-wide rollout of AI assistants/agents for both faculty/staff and students, seeking flexibility, extensibility, and cost scalability. They currently use Microsoft 365 (Copilot) and Langdoc, but face cost-model and extensibility limitations for broad student access. Onyx’s self-hosting, indexing-based knowledge pipeline, permission-aware connectors, and open-source/community + enterprise model are compelling. Technical Requirements Connectors Mentioned: Microsoft 365 (SharePoint, OneDrive, Teams), Salesforce; (discussed in general: Confluence, Jira). Issues/Concerns: Langdoc cost model for low/irregular student usage; need for flexible seat model; extensibility and deeper integrations; desire for self-host option with enterprise permissioning; robust knowledge indexing and permission-respecting retrieval; triggers/workflows roadmap; vendor-agnostic layer between LLMs and users; ability to expose more human-friendly ‘contextual’ connectors. Next Steps - Matt to send follow-up email and calendar invite for Monday (11:00 AM Eastern) for a 15-min follow-up. - Chris to send a write-up by Friday outlining collaboration options (hybrid open-source + paid engagement, contribution pathways, customization/hosting models). - James to share search discovery context with Hult marketing, and review options/requirements internally. - Potential deeper technical dive and commercial discussion in subsequent meeting(s). Participants External: James Warner (<EMAIL>) --- Internal: Matthew Veber (<EMAIL>); Chris Weaver (<EMAIL>) Source: Fireflies Transcript Sales Call Summary – <PHONE> How They Found Us: Google search; also saw Onyx referenced while researching LLM Q&A spaces. Onyx ranked highly and stood out. Seats Discussed: Company size: ~500–1,000 faculty/staff; ~2,000–5,000 students (exact seat count TBD). Goal is universal student access even for low/irregular users. Interested Connectors: Microsoft 365 (SharePoint, OneDrive, Teams), Salesforce. (General discussion: Confluence, Jira as commonly used connectors.) Timeline: Discovery complete; short follow-up on Monday 11:00 AM Eastern; evaluate hybrid engagement and pricing models; potential technical deep dive thereafter. Competitor Consideration: Current tools/alternatives include Langdoc and Microsoft Copilot; also considering build-vs-buy tradeoffs and hybrid approaches. Security Considerations: Need permission-aware indexing aligned to enterprise apps; preference for self-hosting and granular access controls. Self-Hosting or Cloud: Preference for self-host with option to collaborate via community/enterprise; cloud noted for auto-updates and support. Quote Provided: No quote provided. Overview of Use-Case: Provide a vendor-agnostic, flexible coordination/interaction platform between LLMs and users to support both non-technical and technical users. Enable structured access to agents/workflows, broad student rollout with cost scalability, and deep integrations into Microsoft 365 and Salesforce with human-friendly ‘contextual’ connectors. Leverage Onyx’s indexing-based knowledge pipeline and permissioning to improve retrieval quality across SharePoint/Teams/OneDrive and Salesforce data. Desire extensibility to contribute features and tailor to Hult’s curriculum and operations. Full Transcript: Fireflies Link Participants External: James Warner (<EMAIL>) --- Internal: Matthew Veber (<EMAIL>); Chris Weaver (<EMAIL>)
