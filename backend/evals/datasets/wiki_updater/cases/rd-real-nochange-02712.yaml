  Pipeline: default Note: Sales Call Summary Meeting Date: <PHONE> Attendees: Jim Tolman (<EMAIL>); Jo&#x1a;o Ferreira; Thomas D; Yasmeen Mohammed; Andrew Jackson Pricing Discussion - Discussed enterprise vs. open-source model and per-license pricing, with potential two-tier (basic vs. power user) structure to accommodate a broad workforce (e.g., forklift/assembly workers vs. knowledge workers). - No specific pricing numbers quoted on this call. Key Points - Scania seeks an enterprise-wide knowledge base and AI-powered search across SharePoint, Teams, Jira, Confluence, SAP, ServiceNow, etc., plus a RAG foundation for agents (MCP) used by R&D and other teams. - Microsoft Copilot/SharePoint-native options are insufficient at scale; desire to consolidate multiple &#x1c;search boxes&#x1d; and enable hybrid semantic/keyword search with permissions-aware results and APIs/embeddable widgets. - Onyx can support both use cases: enterprise search (answers + links) and platform capabilities (connectors, APIs, agents, bring-your-own-LLM). Technical Requirements Connectors Mentioned: SharePoint, Microsoft Teams, Jira, Confluence, ServiceNow (requested), SAP; others possible. Issues/Concerns: Need self-hosted deployment for proper POC; SSO/SCIM and granular permissions/groups; bring-your-own LLM (e.g., Azure/OpenAI, Bedrock); APIs for intranet top-bar search; frequent sync and permission mirroring. Next Steps - Set up a shared Teams channel for technical collaboration. - Schedule a follow-up session (deeper technical + evaluation planning). - Provide enterprise features for a self-hosted POC and assist with connectors (including ServiceNow) and SSO/SCIM setup. Participants External: Jim Tolman (<EMAIL>); Jo&#x1a;o Ferreira; Thomas D; Yasmeen Mohammed; Andrew Jackson --- Internal: Lindsey Milberg (<EMAIL>); Chris (<EMAIL>); Justin Tahara (<EMAIL>) Source: Fireflies Transcript Sales Call Summary &#x13; <PHONE> How They Found Us: - Internal champion(s) in R&D and IT; colleagues named Onyx among top options; Copilot trials insufficient. Seats Discussed: - Company size large; exact seat count not established on call (evaluation users vs. broad enterprise rollout TBD). Interested Connectors: - SharePoint, Teams, Jira, Confluence, ServiceNow, SAP; APIs/embeddables for intranet; MCP actions for agents. Timeline: - Near-term evaluation with self-hosted POC; follow-up meeting to align scope and responsibilities. Competitor Consideration: - Microsoft Copilot (not meeting needs); another small vendor noted; Onyx evaluated alongside others. Security Considerations: - Self-hosted deployment preferred; SSO/SCIM, permissions mirroring; bring-your-own LLM keys/models. Self-Hosting or Cloud: - Preference for self-hosted for proper testing; cloud trial mentioned but not primary path. Quote Provided: - No quote provided on this call (pricing framework only). Overview of Use-Case: - Consolidate enterprise knowledge into a single search/answer experience and provide a RAG platform for agents across R&D, sales, production, and IT. - Enable APIs/widgets for intranet search and control access by group with SCIM/SSO. - Provide connectors and rapid addition (e.g., ServiceNow within ~1 week) for POC. Full Transcript: - <URL> Participants External: Jim Tolman (<EMAIL>); Jo&#x1a;o Ferreira; Thomas D; Yasmeen Mohammed; Andrew Jackson --- Internal: Lindsey Milberg (<EMAIL>); Chris (<EMAIL>); Justin Tahara (<EMAIL>)
