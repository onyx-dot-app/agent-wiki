doc_content: |-
  ## Description

  Adds `backend/evals/` — offline eval suite for the agents that read or write the wiki. Outside `tests/` because runs hit real LLMs and are parameterized by `(provider, model)`.

  Surfaces under test:
  - `wiki_updater.process_instruction` (MCP: NO_CHANGE vs new body)
  - `wiki_updater.reconcile_document` (ingest: + IRRELEVANT)
  - `ingest_selector.select_candidates` (precision/recall over labeled set)
  - External agent driving `update_doc_nl` (WHEN routing + reused HOW scorers)

  Two axes per surface: **WHEN** (trigger decision) and **HOW** (output quality).

  Scorers:
  - Deterministic: `trigger_class_match`, `bloat_ratio`, `markdown_valid`, `selector_set_metrics`
  - LLM-judge via `app.llm.client.complete`: `facts_present`, `facts_preserved`

  Model matrix: same dataset runs across `(provider, model)` without touching agent code. A context manager swaps `app.llm.client.get_llm_settings` per run; keys from `EVAL_*_API_KEY` env vars. `--dry-run` validates wiring without API keys.

  v0 datasets: 30 wiki_updater cases (NO_CHANGE / CHANGE / IRRELEVANT, bloat-bait, loss-bait), 5 ingest_selector cases, 5 external_agent scenarios. Grows to ~200 once live baseline is reproducible.

  CI: `evals-smoke.yml` (dry-run on PR) + `evals-nightly.yml` (live matrix, pushes to Braintrust).

  Seams honored: LLM through `app.llm.client`; Braintrust SDK only via the new `app.tracing.braintrust.push_experiment`. Strict basedpyright + ruff clean.

  ## How Has This Been Tested?

  - `uv run ruff format --check` — 21 files already formatted
  - `uv run --extra dev basedpyright` (whole backend) — 0 errors
  - `pre-commit run --from-ref origin/main --to-ref HEAD` — every hook Passed
  - Dry-run on each runner: 30/30 wiki_updater + 5/5 ingest_selector + 5/5 external_agent
  - `evals.ci_assert_baseline runs/` passes on every run file
  - No live LLM run yet — needs `EVAL_*_API_KEY` secrets; nightly workflow picks them up when set
