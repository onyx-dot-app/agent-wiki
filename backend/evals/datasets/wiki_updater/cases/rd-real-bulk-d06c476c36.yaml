current_body: |-
  # Bloat Handling

  ## First some stats
  - What is the amount of document updates we get from st-dev per day
  - What are the volumes for the top source types
  - For the documents that get bloated, how many updates are they getting per day?

  ## Some random notes
  - Logic to determine what to pass over should live on the Onyx side
  - It will be a better update on average if we can pass diffs along with the docs. Ideally a section above/below the area with the diff and handling merges where multiple parts are edited.
    - Something like up to 2000 subword tokens above and below the diff might be good

  ## Current implementation
  - BM25 candidates with a cutoff
    - This is probably reasonable however BM25 was built for queries, not documents. Something should maybe be done here.
  - Per candidate page:
    - There are classifications like NO_CHANGE, IRRELEVANT, or applying a new body. The batch reconciler now collects these decisions through a typed `submit_results` tool call instead of parsing fragile free-text result blocks.
    - The reconciler prompt treats bare CRM/contact records as non-actionable for todo pages, requires code changes to answer a specific question the page poses rather than merely sharing a product area, and forbids creating action/checklist entries unless the source explicitly describes work to be done.
    - Edit application still uses targeted FIND/REPLACE blocks, with a trailing-whitespace-normalized fallback so minor spacing differences do not cause an otherwise valid edit to miss.
  - Offline evals now live under `backend/evals/` and explicitly test both **WHEN** to update and **HOW** good the update is.
    - Current scorers relevant to bloat and drift include `bloat_ratio`, `markdown_valid`, `facts_present`, and `facts_preserved`; the full scorer reference also covers `trigger.*`, `diff_addition_ratio`, `entity_density_delta`, `selector_set_metrics`, `no_touch_compliance`, `update_*`, and `error_rate`.
    - The `wiki_updater` dataset currently includes 30 committed cases across NO_CHANGE / CHANGE / IRRELEVANT, including bloat-bait and loss-bait examples. `reconcile_document` has 13 committed cases; PR 112 added the export/convert scripts for production-mined cases but 0 dataset cases, so prod-mined growth is deferred until rows are redacted, kept out of repo, or synthesized without customer PII.
    - CI runs a dry-run smoke eval on PRs and nightly live matrix runs to Braintrust. The <PHONE> live baseline recorded mean bloat scores of 0.99 for Sonnet and 1.00 for GPT-5 on `process_instruction`, and 0.99 for Sonnet and 0.95 for GPT-5 on `reconcile_document`. Braintrust triage checks `error_rate` first, then `trigger.macro_f1`, with `facts_preserved < 0.9` treated as the silent-degradation signal.
  - `backend/scripts/eval_labeler.html` labels exported real-traffic JSONL samples in the browser with six granular labels: should-commit critical/moderate/nit, should-no-change already-covered/extra-info, and irrelevant wrong-selection. It tracks per-outcome progress for `committed`, `no_change`, and `irrelevant` samples, can batch-judge all unjudged samples for a selected reconciler outcome with queue progress, and has a mismatch shortcut for jumping to reconciler-outcome vs human-label disagreements. The wrong-judge counter separately tracks judge-label vs human-label disagreements. The labeler writes labels, coverage notes, source/wiki/diff summaries, and `judge_label` / `judge_reasoning` back to the original `.jsonl` rows, with manual per-sample Anthropic summarization and deduplication for identical source/wiki content. The Judge button, also available with the `j` key, asks `claude-opus-4-7` for an independent source-doc/wiki-page-only suggestion and shows it for human confirmation or override. The judge prompt reserves `irrelevant` for sources with no connection to the page topic, uses `no_change_covered` / `no_change_extra` when a topical source adds nothing, and treats client-side configuration or troubleshooting as relevant for setup/connectivity pages. Exporting `ingest_eval_samples` JSONL rows is handled by `backend/scripts/export_ingest_eval_samples.sh`, which runs `kubectl exec` against a backend pod in any cluster with `INGEST_EVAL_LOGGING=true`. `backend/scripts/convert_ingest_eval_samples.py` converts the export into a stratified `WikiUpdaterCase` JSONL slice using outcome-balanced sampling, a 12-case cap per source type, and wiki-body-prefix deduplication.

  ## Proposed approach
  - Agent loop shoud only have tool calls to do single or multi-edit, it should have looping behavior until it outputs finish or hits a max
  - I would look pretty heavily into prompt tuning, likely this can prevent the bloat pretty strongly.
    - Some other things to include in the prompt:
      - Is this doc close to max length
      - What is the scope of topics allowed for this doc
      - Instructions to not scope-creep the document
  - There should be some heuristics of max page length, if it's longer, we should queue up a compression task
  - I think there should be an advanced page for the doc which is initially LLM generated including the scope of the page. This page can also have user changeable default for max chars of page.
  - We can have a separate loop to prune the doc back to the length and set topics.
  - Can freeze the doc after like some small number of commits (max 10), max time delay from creation (1 week).

  ### Tools
  - edit
  - multi_edit
  - mark_irrelevant
  - finish

  ## Extensions
  - If a doc gets too many updates, it should get flagged to the owner.
