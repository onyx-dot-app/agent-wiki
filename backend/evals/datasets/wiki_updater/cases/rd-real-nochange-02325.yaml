    - Scope notes: They were exploring a reseller motion, with current internal evaluation around 50–60 users and a potential downstream customer around 4,000 seats. No formal quote was provided; Business plan pricing around <AMOUNT> and possible volume discount around <AMOUNT> were discussed, with Enterprise minimum around 200 users.
