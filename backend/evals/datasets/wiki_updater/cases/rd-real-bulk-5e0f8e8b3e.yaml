current_body: |-
  # On-Call Runbook

  ## Alerting

  PagerDuty is used for all production alerts. The on-call rotation is bi-weekly.

  For external Onyx documentation/support escalation, use the docs index at `<URL> contact `<EMAIL>`, join the Onyx Discord, or use `<EMAIL>` for founder-level escalation (co-founders Chris Weaver and Yuhong Sun). For service healthcheck triage, call `GET /health`; on Onyx Cloud use `<URL> and a successful response returns required `success`, nullable `message`, and `data`. For auth/login configuration triage, call `GET /auth/type`; on Onyx Cloud use `<URL> and a successful response returns required `auth_type` (`disabled`, `basic`, `google_oauth`, `oidc`, `saml`, or `cloud`), required `requires_verification`, required `password_min_length`, and nullable `anonymous_user_enabled`. To verify a Bearer token and identify the currently logged-in user, call `GET /me` with Bearer auth; on Onyx Cloud use `<URL> and a successful response returns required `id`, `email`, `is_active`, `is_superuser`, `is_verified`, `role`, and `preferences`, plus fields such as `personalization`, `oidc_expiry`, current-token timestamps/expiry length, `is_cloud_superuser`, `team_name`, `is_anonymous_user`, `password_configured`, and `tenant_info`, while `422` indicates validation details for malformed requests. To fetch only the current user's role, call `GET /get-user-role` with Bearer auth; on Onyx Cloud use `<URL> and a successful response returns required `role` as a string, while `422` indicates validation details for malformed requests. For user inventory triage, call `GET /manage/users` with Bearer auth; on Onyx Cloud use `<URL> with optional query parameters `q`, `accepted_page`, `slack_users_page`, `invited_page`, and `include_api_keys` defaulting to `false`; a successful response returns required `accepted`, `invited`, `slack_users`, `accepted_pages`, `invited_pages`, and `slack_users_pages`, where accepted and Slack user snapshots include fields such as `id`, `email`, `role`, `is_active`, and `password_configured`, and invited user snapshots include `email`, while `422` indicates validation details for malformed requests. For connector/source availability triage, call `GET /manage/indexed-sources` with Bearer auth; on Onyx Cloud use `<URL> a successful response returns required `sources` as an array of indexed source identifiers such as `ingestion_api`, `slack`, `web`, `google_drive`, `gmail`, `github`, `confluence`, `jira`, `file`, `notion`, `sharepoint`, `salesforce`, `s3`, `discord`, `user_file`, and `not_applicable`, while `422` indicates validation details for malformed requests. To inspect a specific connector after identifying a `connector_id`, call `GET /manage/connector/{connector_id}` with Bearer auth; on Onyx Cloud use `<URL> where `connector_id` is a required integer path parameter; a successful response returns a connector snapshot with required `name`, `source`, `input_type` (`load_state`, `poll`, `event`, or `slim_retrieval`), `connector_specific_config`, `id`, `credential_ids`, `time_created`, and `time_updated`, plus nullable `refresh_freq`, `prune_freq`, and `indexing_start`, while `422` indicates validation details for malformed requests. To list connectors or find connectors using a specific credential, call `GET /manage/admin/connector` with Bearer auth; on Onyx Cloud use `<URL> with optional nullable integer query parameter `credential`; a successful response returns an array of connector snapshots with required `name`, `source`, `input_type` (`load_state`, `poll`, `event`, or `slim_retrieval`), `connector_specific_config`, `id`, `credential_ids`, `time_created`, and `time_updated`, plus nullable `refresh_freq`, `prune_freq`, and `indexing_start`, while `422` indicates validation details for malformed requests. To list all public credentials for credential inventory triage, call `GET /manage/admin/credential` with Bearer auth; on Onyx Cloud use `<URL> a successful response returns an array of credential snapshots with required `credential_json`, `admin_public`, `source`, `id`, `user_id`, `time_created`, and `time_updated`, plus fields such as nullable `name`, `curator_public` defaulting to `false`, `groups`, and nullable `user_email`, while `422` indicates validation details for malformed requests. To associate an existing credential with a connector after identifying `connector_id` and `credential_id`, call `PUT /manage/connector/{connector_id}/credential/{credential_id}` with Bearer auth; on Onyx Cloud use `<URL> where both path parameters are required integers; send `application/json` with required `access_type` (`public`, `private`, or `sync`), optional nullable `name`, optional `auto_sync_options`, and optional `groups` as an integer array; a successful response returns required `success`, nullable `message`, and nullable integer `data`, while `422` indicates validation details for malformed requests. For connector/credential pair status inventory, call `GET /manage/admin/connector/status` with Bearer auth; on Onyx Cloud use `<URL> a successful response returns an array of connector status snapshots with required `cc_pair_id`, nullable required `name`, required `connector`, required `credential`, required `access_type` (`public`, `private`, or `sync`), and required `groups`, while `422` indicates validation details for malformed requests. To force-delete a credential after identifying a `credential_id`, call `DELETE /manage/credential/force/{credential_id}` with Bearer auth; on Onyx Cloud use `<URL> where `credential_id` is a required integer path parameter; a successful response returns required `success`, nullable `message`, and `data` as `null`, while `422` indicates validation details for malformed requests. For file connector file inventory triage after identifying a `connector_id`, call `GET /manage/admin/connector/{connector_id}/files` with Bearer auth; on Onyx Cloud use `<URL> where `connector_id` is a required integer path parameter; a successful response returns required `files`, where each file entry includes `file_id`, `file_name`, `file_size`, and `upload_date`, while `422` indicates validation details for malformed requests. To upload files for a file connector during upload triage, call `POST /manage/admin/connector/file/upload` with Bearer auth; on Onyx Cloud use `<URL> send `multipart/form-data` with required `files` as a file array; a successful response returns required `file_paths`, `file_names`, and `zip_metadata`, while `422` indicates validation details for malformed requests. For connector indexing-status triage, call `POST /manage/admin/connector/indexing-status` with Bearer auth; on Onyx Cloud use `<URL> send `application/json` with optional filters including `secondary_index` defaulting to `false`, nullable `source`, `access_type_filters` (`public`, `private`, or `sync`), `last_status_filters` (`not_started`, `in_progress`, `success`, `canceled`, `failed`, or `completed_with_errors`), nullable `docs_count_operator` (`>`, `<`, or `=`), nullable `docs_count_value`, nullable `name_filter`, `source_to_page`, and `get_all_connectors` defaulting to `false`; a successful response returns an array grouped by `source` with required `summary`, `current_page`, `total_pages`, and `indexing_statuses`, where status entries include fields such as `cc_pair_id`, `name`, `source`, `access_type`, `cc_pair_status`, `in_progress`, `in_repeated_error_state`, `last_finished_status`, `last_status`, `last_success`, `is_editable`, `docs_indexed`, and `latest_index_attempt_docs_indexed`, while `422` indicates validation details for malformed requests. To fetch currently failed connector indexing statuses directly, call `GET /manage/admin/connector/failed-indexing-status` with Bearer auth; on Onyx Cloud use `<URL> with optional query parameters `secondary_index` defaulting to `false` and `get_editable` defaulting to `false`; a successful response returns an array of failed connector/credential pair snapshots with required `cc_pair_id`, nullable required `name`, nullable required `error_msg`, required `is_deletable`, required `connector_id`, and required `credential_id`, while `422` indicates validation details for malformed requests. To list documents indexed for a connector/credential pair after identifying a `cc_pair_id`, call `GET /onyx-api/connector-docs/{cc_pair_id}` with Bearer auth; on Onyx Cloud use `<URL> where `cc_pair_id` is a required integer path parameter; a successful response returns an array of document snapshots with required `document_id`, required `semantic_id`, and nullable `link`, while `422` indicates validation details for malformed requests. For backend version triage, call `GET /version`; on Onyx Cloud use `<URL> and a successful response returns required `backend_version` as a string. For latest Onyx Docker image tag triage, call `GET /versions`; on Onyx Cloud use `<URL> and a successful response returns required `stable`, `dev`, and `migration` container-version objects, each including image tags for `onyx`, `relational_db`, `index`, and `nginx`. For current-user project inventory triage, call `GET /user/projects/` with Bearer auth; on Onyx Cloud use `<URL> a successful response returns an array of projects with required `id`, `name`, nullable required `description`, required `created_at`, nullable required `user_id`, required `chat_sessions`, and nullable `instructions`; `chat_sessions` entries include fields such as `id`, `name`, `time_created`, `time_updated`, `shared_status`, `persona_id`, `current_alternate_model`, and `current_temperature_override`, while `422` indicates validation details for malformed requests. To list the current user's chat sessions during chat triage, call `GET /chat/get-user-chat-sessions` with Bearer auth; on Onyx Cloud use `<URL> with optional query parameters `project_id`, `only_non_project_chats` defaulting to `true`, and `include_failed_chats` defaulting to `false`; a successful response returns required `sessions`, where each chat session includes fields such as `id`, `name`, `time_created`, `time_updated`, `shared_status`, `persona_id`, `current_alternate_model`, and `current_temperature_override`, while `422` indicates validation details for malformed requests. To search chat sessions during chat triage or identify a `session_id`, call `GET /chat/search` with Bearer auth; on Onyx Cloud use `<URL> with optional query parameters `query`, `page` defaulting to `1`, and `page_size` defaulting to `10`; if no query is provided, the endpoint returns recent chat sessions, and a successful response returns required `groups`, `has_more`, and nullable `next_page`, where each group has a `title` and `chats` entries with fields such as `id`, `time_created`, `shared_status`, `name`, `persona_id`, and `current_temperature_override`, while `422` indicates validation details for malformed requests. For chat transcript/session triage after identifying a `session_id`, call `GET /chat/get-chat-session/{session_id}` with Bearer auth; on Onyx Cloud use `<URL> where `session_id` is a required UUID path parameter, with optional query parameters `is_shared` defaulting to `false` and `include_deleted` defaulting to `false`; a successful response returns required `chat_session_id`, nullable required `description`, nullable required `persona_name`, nullable required `personal_icon_name`, required `messages`, required `time_created`, required `shared_status` (`public` or `private`), nullable required `current_alternate_model`, nullable required `current_temperature_override`, required `packets`, nullable `persona_id`, and `deleted` defaulting to `false`, while `422` indicates validation details for malformed requests. To stop an active chat session after identifying a `chat_session_id`, call `POST /chat/stop-chat-session/{chat_session_id}` with Bearer auth; on Onyx Cloud use `<URL> where `chat_session_id` is a required UUID path parameter; the endpoint sets a stop signal in Redis and is the same stop path used by the frontend, with `200` returning a JSON object and `422` indicating validation details for malformed requests. To delete one chat session after identifying a `session_id`, call `DELETE /chat/delete-chat-session/{session_id}` with Bearer auth; on Onyx Cloud use `<URL> where `session_id` is a required UUID path parameter, with optional query parameter `hard_delete` as a nullable boolean; a successful response returns `200` with `application/json`, while `422` indicates validation details for malformed requests. To delete all chat sessions, call `DELETE /chat/delete-all
