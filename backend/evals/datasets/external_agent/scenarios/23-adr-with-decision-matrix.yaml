  Tests deep edit of a long ADR with a decision matrix, decision log,
  and multi-section consequences analysis. The amendment must be
  surgical — adding without replacing the original decision, and every
  rejected-alternative analysis must persist verbatim because those
  analyses still apply to non-recs workloads.
