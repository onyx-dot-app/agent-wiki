    facts_present:
      - id: root-cause
        text: the postmortem identifies the key-rotation cron racing with JWKS-publish as the root cause
      - id: ai-1
        text: AI-1 (owner Park, due 2026-06-01, serialize the two crons) is documented
      - id: ai-2
        text: AI-2 (owner Patel, due 2026-06-15, pre-flight JWKS reachability check) is documented
    facts_preserved:
      - id: timeline-0312
        text: the 03:12 timeline entry remains
      - id: timeline-0324
        text: the 03:24 manual recovery timeline entry remains
      - id: impact
        text: the 12-minute 100% token verification failure impact remains
  - path: services/auth/runbook.md
    facts_present:
      - id: runbook-pm-pointer
        text: the runbook points to the 2026-05-15 auth outage postmortem
    facts_preserved:
      - id: runbook-pagers
        text: all four pager-table rows remain
      - id: runbook-recovery
        text: the kubectl restart and JWKS republish commands remain
  - path: services/auth/jwt.md
    facts_present:
      - id: jwt-pm-pointer
        text: the JWT page points to the 2026-05-15 auth outage postmortem
    facts_preserved:
      - id: jwt-rs256
        text: RS256 + JWKS publication + 30-day rotation remain documented
      - id: jwt-claims
        text: the sub/tid/scp/exp claims list remains
      - id: jwt-verify
        text: the JWKS cache TTL = 24h verification flow remains
expected_not_updated:
  - services/auth/overview.md
notes: |
  Long fan-out across three docs with strong loss-bait (long bodies).
  One related architectural overview must NOT change — the postmortem
  doesn't reshape the architecture, only the operations.
tags: [multi-doc, long-docs, loss-bait, fan-out]
