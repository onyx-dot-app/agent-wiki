id: ext-05-correction
prompt: |
  The payments SLA page has a typo and a wrong number. The target is 99.95%
  (not 99.9%), and "Avilability" should be "Availability". Fix the page.
wiki_state:
  - path: services/payments/sla.md
    summary: Payments service SLA.
    body: |
      # Payments SLA

      Avilability target 99.9% monthly. Latency p95 < 200ms.
  - path: services/orders/sla.md
    summary: Orders service SLA.
    body: |
      # Orders SLA

      Availability target 99.9% monthly. Latency p95 < 350ms.
expected_updates:
  - path: services/payments/sla.md
    facts_present:
      - id: fixed-typo
        text: the page spells the word as "Availability"
      - id: correct-target
        text: the availability target is 99.95% monthly
    facts_preserved:
      - id: latency
        text: the p95 latency target under 200ms is still documented
expected_not_updated:
  - services/orders/sla.md
notes: Tests targeted correction without touching unrelated SLA page.
tags: [correction]
