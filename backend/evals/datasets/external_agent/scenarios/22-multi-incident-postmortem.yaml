      # SRE on-call rotation

      Weekly rotation Mon 09:00 PT. Handoff in `#oncall-handoff` with a
      brief of any open incidents and pending toil.

      ## Current schedule

      See the PagerDuty schedule `eng-primary`.

      ## Recent incidents (rolling 30 days)

      - 2026-05-18 — multi-service 401 storm (47 min above SLO; mitigated by manual JWKS publisher restart). See `ops/incidents/2026-05-18-multi-service-401-storm.md` for details.
      - 2026-04-12 — cache stampede on recs (5x origin load, 19 min above SLO).
      - 2026-04-03 — search reindex backlog (no customer impact).

      ## On-call expectations

      - Acknowledge pages within 5 minutes (after-hours: 10 min).
      - Open an incident in `#incidents` with `/incident` if the issue
        will exceed 30 minutes.
      - Hand off with a written summary at the end of your rotation.
