      # Acme SharePoint Connector Issues — Living Document

      Last updated: 2026-05-18

      This is a living document describing the issues Acme has run into with
      the SharePoint connector. All Onyx-indexed communication about Acme in
      the #customer-support Slack channel that involves SharePoint is cited
      here.

      Citation note: The references below are Slack / meeting links surfaced
      from Onyx search. In several cases Onyx exposed the indexed Slack
      result link and thread context, but not all original attachments or
      complete thread metadata.

      ## Table of contents

      1. Overview and useful context
      2. Acme identifiers found
      3. Version / deployment timeline
      4. Specific incidents and resolutions
      5. Recurring patterns and likely root causes
      6. Resolved or mitigated items
      7. Open issues / unresolved questions
      8. Recommendations / action items
      9. Operational follow-up tracker
      10. Source reference index

      ## Overview and useful context

      As of the latest #customer-support evidence, Acme was on Onyx v3.3.0,
      had one active SharePoint connector, and was still experiencing
      indexing throughput / connector reliability issues. Justin noted that
      this active connector "keeps hitting issues," that Acme likely runs on
      Kubernetes, and that Onyx needed to provide an upgrade strategy. A
      suspected deployment anomaly was also noted: the OpenSearch migration
      page was missing, raising concern that Acme might be on v3.3.0 without
      an OpenSearch container. Evan was assigned to continue looking through
      logs and SharePoint issue details. [5]

      The prior May 11 update showed meaningful progress: Acme devtest had
      been upgraded to v3.3.0; Vespa memory had been increased from 32Gi to
      48Gi; old Vespa 507 Insufficient Storage / feed-blocking had stopped
      being the active blocker; docfetching workers were stable after a
      probe-timeout change; and a local SharePoint hotfix changed
      unauthorized .aspx page handling from "abort the whole connector run"
      to "record as per-document failure." However, the connector named
      "SharePoint all ASPX sites since first of March" was still failing on
      Microsoft Graph 404 itemNotFound for `/teams/Almedalentrip`,
      interpreted as a missing or invalid SharePoint site in the crawl
      scope. [2]

      There is an apparent but explainable tension between the May 11 and
      May 13 updates: on May 11, Lindsey relayed that Jim said they seemed
      to be "up and running" at 180–200 docs/minute, while the same May 11
      update still listed the Almedalentrip Graph 404 as the active
      run-level blocker for a specific connector. [2] By May 13, Justin
      again said Acme still had throughput issues and only one active
      SharePoint connector that kept hitting issues. [5] This likely means
      Acme saw partial throughput improvement but had not reached a stable,
      fully resolved state.

      ## Acme identifiers found

      | Identifier | Context |
      | -- | -- |
      | `tenant_14119003-03f5-4f4c-b64d-9ae3ffae5a2e` | Mentioned in the Feb. 17 "Acme Call" thread when Justin could not find @acme.com emails in cloud. [9] |
      | `tenant_aaf981ad-fc1c-42eb-9e2b-cbddd8f0c312` | License/workspace block in the Mar. 25 "Acme report": Org Acme, 50 seats, monthly plan, expires 2026-04-24T00:00:00+00:00. [8] |
      | `acmeazureservices.sharepoint.com` | SharePoint tenant/domain in multiple connector errors. [1], [2], [3] |
      | `/teams/AIatAcme` | Apr. 20 401 Unauthorized while fetching role assignments for a site page. [1] |
      | `/teams/Plymothepsvnner` | Apr. 20 Microsoft Graph 404 itemNotFound; likely invalid/misspelled/inaccessible. [1] |
      | `/teams/SJPIndependentDealers` | Apr. 30 .aspx site-page 401 Unauthorized; later described as resolved by local hotfix behavior change. [3], [2] |
      | `/teams/Almedalentrip` | May 11 Microsoft Graph 404 itemNotFound; current blocker for "SharePoint all ASPX sites since first of March". [2] |
      | R&D hub | SharePoint scope/site involved in Apr. 22 sync issue and Apr. 30 group/member permission traversal failure. [11], [3] |

      ## Version / deployment timeline

      | Date | Version / deployment state | Notes |
      | -- | -- | -- |
      | Apr. 20 | v2.12.6 | SharePoint 401 and 404 errors reported; embedding swap/OpenAI embedding config not available in Acme's version. [1] |
      | Apr. 30 | v3.2.1 | Still "a bit behind"; needed a tag with all fixes; permission sync not running; GitHub commit proposed for backport. [3] |
      | May 11 | Devtest on v3.3.0 | Vespa memory increased; SharePoint .aspx hotfix applied; worker/probe timeout improved; remaining blocker was Graph 404 for `/teams/Almedalentrip`. [2] |
      | May 13 | v3.3.0 | Still having throughput issues; one active SharePoint connector kept hitting issues; suspected missing OpenSearch container/migration page; possible move toward v4.0.X for metrics work. [5] |

      ## Specific incidents and resolutions

      ### 1. Feb. 17 — Initial Acme call: user/log confusion, validation failure, possible firewall issue

      Slack conversation: "Acme Call" in #customer-support. [9]

      Justin reported that he did not see any @acme.com emails in Onyx cloud
      and could not find the user whose logs he wanted to pull. He suspected
      the user might be using a personal gmail and recorded tenant ID
      `tenant_14119003-03f5-4f4c-b64d-9ae3ffae5a2e`. The thread framed the
      situation as likely an "us issue" and emphasized that Acme seemed
      ready to proceed, but Onyx needed to deliver a smooth connector
      experience and high-quality search. A validation failure was
      discussed; Justin was "reasonably confident" it was a firewall issue,
      and a clearer error message was called out as a takeaway. [9]

      Category: Initial setup / validation; possible firewall / customer
      environment; logging / supportability gap.

      Resolution status: No confirmed resolution in retrieved Slack content;
      next step was more logs and continued discussion.

      ### 2. Feb. 19 — Early SharePoint ingestion-speed concern tied to Acme

      Slack conversation: Playlist/Acme SharePoint ingestion-speed thread. [10]

      Justin asked Evan whether a fix from the previous day would help
      SharePoint ingestion speed, saying this would likely become more
      important "especially with the Acme deal." The discussion questioned
      whether indexing 3TB of SharePoint data made sense and suggested
      pushing back on scope. [10]

      Category: Sync throughput / ingestion speed; connector scope design;
      customer data scale.

      Resolution status: No Acme-specific resolution; suggested mitigation
      was narrower scoping and benchmarking.

      ### 3. Mar. 3 — Security rejects broad SharePoint read all; asks for site select

      Slack conversation: "Acme security ?s". [6]

      Lindsey reported Acme IT Security declined to allow the connector to
      have `read all` access and wanted `site select` instead. Acme also
      asked whether OpenAI embedding models would cause Acme information to
      leave Acme's control. [6]

      Category: Security / governance; SharePoint permission model;
      connector configuration; customer environment constraints.

      Resolution status: No final answer or resolution appears in retrieved
      Slack content.

      ### 4. Mar. 11 — Security asks about OneDrive, DLP, sensitivity labels, and permission-change lag

      Slack conversation: "Latest Acme Security Questions to be answered". [7]

      Lindsey posted additional Acme Security questions about OneDrive
      content, Data Loss Prevention rules, sensitivity labels including
      confidential/secret and encrypted files, and permission-change
      propagation latency. [7]

      Category: Security / governance; permissions sync latency; DLP /
      labels / encryption.

      Resolution status: No confirmed answers appear in retrieved Slack
      content.

      ### 5. Mar. 25 — Trial/license escalation and 403 forbidden on permission change

      Slack conversation: "Acme report". [8]

      Lindsey reported trial/license details and noted Acme now had a weekly
      escalation call because security colleagues were delaying rollout.
      SharePoint-specific issue: Jim tried to change permissions to open up
      a private document but got 403 forbidden. [8]

      Category: Permission propagation / authorization; rollout delay.

      Resolution status: No confirmed resolution.

      ### 6. Apr. 20 — v2.12.6: 401 on AIatAcme; Graph 404 on /teams/Plymothepsvnner

      Slack conversation: "Acme Followup Issues". [1]

      Justin posted that Acme was using Onyx v2.12.6. One stack trace failed
      during SharePoint site-page conversion and external permission
      fetching with `401 Client Error: Unauthorized`. The affected URL
      targeted `/teams/AIatAcme/SitePages/...`. A second trace showed Graph
      404 itemNotFound for `/teams/Plymothepsvnner`. A reply characterized
      the problems as likely a permission issue and a site-name spelling
      issue. [1]

      Category: Authentication / permissions; missing or invalid site;
      connector runtime failure; deployment/version gap.

      Resolution status: No direct resolution; Subash and Evan were tagged
      to investigate.

      ### 7. Apr. 30 — v3.2.1: chunked response failure, .aspx 401, R&D hub traversal, permission sync not running

      Slack conversation: "Acme Sharepoint Issues". [3]

      Justin posted Acme was on v3.2.1, "a bit behind," and that Onyx needed
      to give them a tag containing all fixes. Issues observed:

      - `ChunkedEncodingError: Response ended prematurely` during permission-aware drive item processing
      - `401 Unauthorized` for `/teams/SJPIndependentDealers/_api/Web/...` site page role assignments
      - R&D hub group/member traversal failure (truncated in indexed slack content)
      - Permission sync not running; commit `667db2e8f573f015d9030e634c0bd1d8bbc0685b` proposed for backport

      Category: Permission/external access failures; connector runtime
      failure; group/member resolution; permission sync scheduling/version
      issue.

      Resolution status: No customer-confirmed resolution. May 11 later
      confirms `.aspx` page-failure behavior was mitigated with a local
      hotfix. [2]

      ### 8. May 11 — v3.3.0: Vespa 507 resolved, .aspx behavior hotfixed, active blocker is Graph 404

      Slack conversation: "Acme Update - New thread". [2]

      Acme devtest had been upgraded to v3.3.0. Vespa memory was increased
      from `32Gi -> 48Gi` and the old 507 Insufficient Storage / feed
      blocking stopped being the active blocker. A local hotfix changed
      behavior so a single unauthorized `.aspx` page is recorded as a
      per-document failure instead of aborting the entire run. Docfetching
      workers were stable after a probe-timeout change. The current blocker
      was Microsoft Graph 404 itemNotFound for `/teams/Almedalentrip`
      against the `SharePoint all ASPX sites since first of March`
      connector. Jim reported throughput of 180–200 docs/minute. [2]

      Resolution status: Partially resolved / partially open.

      ### 9. May 13 — Upgrade path: still throughput issues, one active connector, missing OpenSearch concern

      Slack conversation: "Acme Upgrade path". [5]

      Justin posted Acme was on v3.3.0 and still having indexing throughput
      issues. Confirmed state:

      - Acme had only one active SharePoint connector running.
      - That connector kept hitting issues.
      - The OpenSearch migration page was missing, suggesting there might
        not be an OpenSearch container running.
      - Acme likely used Kubernetes, so Onyx needed to send upgrade
        strategy information.
      - v4.0.X was discussed because Evan's metrics work should be part of
        that release.
      - Evan was assigned to continue reviewing logs and information to
        figure out the SharePoint issues.

      Resolution status: Open as of latest retrieved #customer-support
      evidence.

      ## Recurring patterns and likely root causes

      1. Permission-aware SharePoint indexing is the central systemic issue
      2. Unauthorized `.aspx` pages used to abort connector runs (mitigated)
      3. Invalid/missing sites in broad crawl scope cause Graph 404s
      4. Throughput bottleneck is mostly SharePoint fetch/permissions, not general compute
      5. SharePoint API rate limiting is suspected but not proven
      6. Deployment/version gaps delayed fixes
      7. Acme's security model and data scale make this a difficult customer environment

      ## Resolved or mitigated items

      - Vespa 507 Insufficient Storage / feed blocking — resolved by increasing Vespa memory from `32Gi` to `48Gi`. [2]
      - Unauthorized `.aspx` page aborting whole connector run — mitigated in Acme devtest by local hotfix. [2]
      - SJPIndependentDealers earlier 401 failure pattern — May 11 update says the `.aspx` hotfix resolved it. [2]
      - Docfetching worker timeout / probe instability — May 11 update says workers were stable. [2]
      - Throughput improved from 4–6 docs/min to 180–200 docs/min, then regressed (see May 13). [2], [5]

      ## Open issues / unresolved questions

      - Active Graph 404 for `/teams/Almedalentrip` — validate whether the site exists, was renamed/deleted, requires different permissions, or should be removed from crawl scope. [2]
      - Ongoing throughput instability — deploy indexing phase metrics to isolate SharePoint fetch, permission lookup, queueing, doc processing, embedding, and Vespa/indexing time. [5]
      - Missing OpenSearch migration page / possible missing OpenSearch container — confirm deployment topology and provide Kubernetes upgrade guidance. [5]
      - Permission sync / group sync visibility and scheduler behavior — verify scheduler jobs are running and confirm commit `667db2e8f573f015d9030e634c0bd1d8bbc0685b` or equivalent is deployed. [3]
      - R&D hub final root cause — Apr. 22 screenshot/error details are missing; Apr. 30 trace is truncated before final exception. [11], [3]
      - 403 forbidden on opening private doc — confirm whether user error, SharePoint propagation delay, missing permission, or expected behavior. [8]
      - Security/governance answers incomplete. [6], [7]

      ## Recommendations / action items

      1. Validate and clean crawl scope — remove invalid sites such as `/teams/Almedalentrip` and `/teams/Plymothepsvnner` unless Acme confirms they exist. [1], [2]
      2. Keep per-document failure behavior for inaccessible `.aspx` pages in Acme's durable release/tag. [2]
      3. Verify permission sync / group sync scheduling and commit `667db2e8f573f015d9030e634c0bd1d8bbc0685b` is deployed. [3]
      4. Deploy per-phase indexing metrics (connector fetch, SharePoint permission fetch, queue wait, doc processing, embedding, Vespa). [5]
      5. Split large SharePoint scope into multiple connectors. [13]
      6. Treat SharePoint API rate limits as a hypothesis to test, not a proven root cause. [13], [14]
      7. Confirm OpenSearch / upgrade path and provide Kubernetes-specific upgrade instructions. [5]

      ## Operational follow-up tracker

      - [ ] Confirm `/teams/Almedalentrip` status with Acme SharePoint admins.
      - [ ] Confirm `/teams/Plymothepsvnner` was typo/deleted/inaccessible and remove if invalid.
      - [ ] Confirm Acme deployment includes `.aspx` per-document failure hotfix.
      - [ ] Confirm permission-sync and group-sync scheduler jobs are running.
      - [ ] Confirm GitHub commit `667db2e8f573f015d9030e634c0bd1d8bbc0685b` or equivalent is in Acme tag.
      - [ ] Confirm OpenSearch deployment/migration state on Acme `v3.3.0`.
      - [ ] Provide Kubernetes upgrade guide and target release/tag.
      - [ ] Deploy indexing phase metrics build.
      - [ ] Split broad SharePoint crawl into multiple scoped connectors.
      - [ ] Produce Acme security FAQ covering site-select, DLP, labels, OneDrive, embeddings, permission lag, and audit logs.

