  - path: engineering/sharepoint-connector-performance.md
    summary: Engineering performance overview for the SharePoint connector (tangentially mentions Acme).
    body: |
      # SharePoint connector — performance overview

      Onyx's SharePoint connector retrieves documents via the Microsoft
      Graph + SharePoint REST APIs with permission-aware indexing. This
      document is the engineering reference for performance behavior; for
      customer-specific tuning, see the customer page (e.g. Acme is on
      `customers/acme/sharepoint-issues.md`).

      ## Phases per connector run

      1. **Site enumeration** — Graph `/sites` walk, scoped to the connector's site list.
      2. **Drive enumeration** — per-site drive list.
      3. **Item iteration** — paginated drive-item iteration, including pages, files, and lists.
      4. **Permission fetch** — per-item role-assignment fetch via Graph + REST endpoints.
      5. **Group expansion** — recursive resolution of Azure AD groups to user/email lists.
      6. **Chunking + embedding + index write** — parallel across docfetching workers.

      Phases 1–5 are serialized per connector. Phase 6 parallelizes across
      replicas. A common misdiagnosis is to add more docfetching pods to
      speed up phase 4; that does not help because the SharePoint fetch
      stage is a single long-lived task.

      ## Known throughput ranges

      | Connector type | Typical | Best observed |
      | -- | -- | -- |
      | Organization-public (no permission fetch) | 80–120 docs/min | 220 docs/min |
      | Permission-synced, narrow scope | 30–60 docs/min | 120 docs/min |
      | Permission-synced, broad scope (1000+ sites) | 5–15 docs/min | 40 docs/min |

      ## Common slowdowns

      - Permission fetching dominates wall time for permission-synced runs.
      - Graph + REST API latency varies 200ms–2s; tail latency on
        permission endpoints is much worse than item-list endpoints.
      - Broad crawl scopes that include invalid/inaccessible sites cause
        repeated 404 / 401 / 403 responses that consume retry budget.
      - Group expansion can be exponential when groups are deeply nested.

      ## Mitigations

      - Split broad scopes into multiple connectors by business area or
        site list.
      - Prefer organization-public connectors for content that does not
        need permission preservation.
      - Use indexing phase metrics (added in v4.0.X) to isolate the actual
        bottleneck rather than guessing.
      - Validate crawl scope against Graph before run; invalid sites
        should be quarantined, not blockers.

      ## Observability

      Per-phase timing metrics ship in v4.0.X. Until then, the most useful
      signal is the worker log line:

      ```
      [INFO] docfetching: site=<site> phase=<phase> elapsed_ms=<n> items=<n>
      ```

      Filter by `site=` to identify which sites in a broad crawl are
      monopolizing the run.
